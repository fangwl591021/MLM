<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>康立智能 QR 贈5 K點</title>
  <style>
    :root{--line:#06c755;--ink:#101828;--sub:#667085;--border:#d8e0eb;--soft:#f7fafc}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#f9fffb,#eef6f8);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(520px,100%);padding:28px}
    .card{border:1px solid var(--border);border-radius:22px;background:#fff;padding:28px;text-align:center;box-shadow:0 24px 70px rgba(16,24,40,.12)}
    .mark{width:62px;height:62px;margin:0 auto 14px;border-radius:18px;background:var(--line);display:grid;place-items:center;color:#fff;font-weight:900;font-size:22px}
    h1{margin:0 0 8px;font-size:28px;line-height:1.25}
    p{margin:0;color:var(--sub);line-height:1.7}
    img{display:block;width:min(360px,100%);height:auto;margin:22px auto;border:12px solid #fff;border-radius:18px;box-shadow:0 8px 30px rgba(16,24,40,.10)}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;border-radius:999px;background:var(--line);color:#fff;text-decoration:none;font-weight:900;padding:0 18px}
    small{display:block;margin-top:14px;color:#8a95a6;line-height:1.6;word-break:break-all}
  </style>
</head>
<body>
  <main>
    <section class="card">
      <div class="mark">KL</div>
      <h1>康立智能 QR 贈5 K點</h1>
      <p>請會員開啟 LINE 掃描器掃碼，完成後自動領取 5 K點。</p>
      <img src="reward-smart-202605-5-qr.png" alt="康立智能 QR 贈5 K點">
      <a href="https://liff.line.me/2007221311-WjM9sZPz?campaign=smart_202605_5">開啟領取頁</a>
      <small>https://liff.line.me/2007221311-WjM9sZPz?campaign=smart_202605_5</small>
    </section>
  </main>
</body>
</html>
