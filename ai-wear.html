<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>康立負離子眼鏡系列</title>
    <style>
    :root{color-scheme:light;--ink:#101828;--muted:#667085;--line:#e4eaf2;--green:#08bf5b;--purple:#7c4ddb;--bg:#f6f8fb;--panel:#fff;--soft:#f1f5f9;--bad:#b42318}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.65}
    .wrap{max-width:920px;margin:0 auto;padding:18px 14px 18px;min-height:100vh;display:flex;flex-direction:column;gap:16px}.head{background:linear-gradient(135deg,#fff 0%,#f1e9ff 100%);border:1px solid var(--line);border-radius:22px;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}.head h1{margin:0 0 8px;font-size:26px}.head p{margin:0;color:var(--muted);line-height:1.6}.memberBox{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.85);border:1px solid #d9e2ef;border-radius:18px;padding:10px 12px;min-width:190px;box-shadow:0 10px 26px rgba(16,24,40,.06)}.memberAvatar{width:46px;height:46px;border-radius:999px;object-fit:cover;background:#e8eef6}.memberBox strong{display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.memberBox span{display:block;color:#067647;font-weight:900;margin-top:2px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 16px 42px rgba(16,24,40,.06)}.step{display:flex;align-items:center;gap:10px;margin:0 0 14px}.num{width:32px;height:32px;border-radius:999px;background:var(--purple);color:#fff;display:grid;place-items:center;font-weight:900}.step h2{margin:0;font-size:21px}.drop{border:2px dashed #c7b2ff;border-radius:18px;background:#fbf8ff;padding:16px;text-align:center}.primary{width:100%;min-height:52px;border:0;border-radius:14px;background:var(--purple);color:#fff;font-weight:900}.green{background:var(--green)}.secondary{border:1px solid #cfd8e6;border-radius:12px;background:#fff;color:#101828;font-weight:800;padding:10px 12px}.muted{color:var(--muted)}.preview{max-width:100%;max-height:320px;border-radius:16px;margin:12px auto 0;display:none;border:1px solid var(--line);object-fit:contain}
    .intro{display:grid;grid-template-columns:1fr 1fr;gap:10px}.introItem{background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:12px;line-height:1.55}.introItem strong{display:block;margin-bottom:4px}.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:850;color:#344054}.tab.active{background:#ecfdf3;border-color:#86efac;color:#067647}.modelCard{min-height:0;display:flex;flex-direction:column;flex:1}.models{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-height:clamp(260px,42vh,560px);overflow:auto;padding-right:4px;overscroll-behavior:contain}.model{border:2px solid transparent;border-radius:18px;background:#fff;padding:10px;box-shadow:0 10px 24px rgba(16,24,40,.05);text-align:center}.model.active{border-color:var(--purple);background:#fbf8ff}.model img{width:100%;aspect-ratio:1.2/1;object-fit:contain;border-radius:14px;background:#f8fafc}.model strong{display:block;margin-top:8px;font-size:15px}.model span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.bottomDock{position:sticky;bottom:0;z-index:20;background:linear-gradient(180deg,rgba(246,248,251,.72),var(--bg) 18px);padding-top:10px}.bottomDock .card{margin-top:10px}.bottomDock .card:first-child{margin-top:0}.bottomDock .result{max-height:260px;overflow:auto}
    .resultGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.resultItem{border:1px solid var(--line);border-radius:18px;padding:12px;background:#fff}.resultItem img{display:block;width:100%;max-height:360px;border-radius:16px;border:1px solid var(--line);object-fit:contain;background:#f8fafc}.resultItem strong{display:block;margin-top:10px}.resultItem p{margin:6px 0 0;color:var(--muted);font-size:13px}.status{margin-top:12px;border-radius:14px;padding:12px;background:#f8fafc;color:var(--muted);line-height:1.55}.status.bad{background:#fff1f3;color:var(--bad)}.status.ok{background:#ecfdf3;color:#067647}.empty{padding:18px;background:#f8fafc;border-radius:16px;color:var(--muted);line-height:1.6}.hidden{display:none!important}.pill{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 10px;border-radius:999px;background:#ecfdf3;color:#067647;font-weight:800;font-size:13px}
    .progressWrap{margin-top:12px;background:#eef2f7;border-radius:999px;overflow:hidden;height:16px;border:1px solid #d9e2ef}.progressBar{width:0%;height:100%;background:linear-gradient(90deg,#7c4ddb,#08bf5b);transition:width .35s ease}.progressText{display:flex;justify-content:space-between;margin-top:8px;color:#475467;font-size:13px;font-weight:800}.selectedIntro{margin-top:12px;background:#f7fffb;border:1px solid #bbf7d0;border-radius:16px;padding:12px;line-height:1.55;color:#14532d}
    @media(max-width:560px){.head{grid-template-columns:1fr}.memberBox{width:100%;justify-content:flex-start}.intro,.resultGrid{grid-template-columns:1fr}.models{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-height:36vh}.model{padding:8px;border-radius:16px}.model strong{font-size:13px}.model span{font-size:11px}.head h1{font-size:24px}.wrap{padding:12px 10px 16px;gap:12px}.bottomDock .result{max-height:220px}}
  </style>
</head>
<body>
    <main class="wrap">
    <section class="head"><div><h1 id="title">康立負離子眼鏡系列</h1><p id="subtitle">上傳自拍照，選擇下方 MODEL，AI 會產生試戴圖片。</p></div><div id="memberBox" class="memberBox hidden"><img id="memberAvatar" class="memberAvatar" alt="LINE 頭貼"><div><strong id="memberName">LINE 會員</strong><span id="memberPoints">K點讀取中</span></div></div></section>
    <section class="card"><div class="step"><div class="num">i</div><h2>商品介紹</h2></div><div class="intro"><div class="introItem"><strong>負離子眼鏡</strong><span>以真實自拍為主圖，套用康立眼鏡素材，快速確認臉型與鏡框協調度。</span></div><div class="introItem"><strong>系列選擇</strong><span>依 3、5、7、8、9、10 等系列篩選，縮短挑選時間。</span></div></div><div id="selectedIntro" class="selectedIntro hidden"></div></section>
    <section class="card"><div class="step"><div class="num">1</div><h2>上傳自拍照或選取相片</h2></div><div class="drop"><input id="personFile" class="hidden" type="file" accept="image/jpeg,image/png,image/webp" /><button id="choosePerson" class="primary" type="button">選取自拍照</button><p class="muted">支援 JPG / PNG / WEBP。上傳後會保存到本系統，不連外部 aiwe。</p><img id="personPreview" class="preview" alt="自拍預覽" /><div id="selfieBadge" class="pill hidden"></div></div></section>
    <section class="card modelCard"><div class="bar"><div class="step"><div class="num">2</div><h2>選擇 MODEL</h2></div><button id="reload" class="secondary" type="button">重新整理</button></div><div id="seriesTabs" class="tabs"></div><div id="models" class="models"><div class="empty">載入眼鏡素材中...</div></div></section>
    <div class="bottomDock">
      <section class="card"><div class="step"><div class="num">3</div><h2>預覽與生成</h2></div><button id="generate" class="primary green" type="button">預覽與生成</button><div class="progressWrap hidden" id="progressWrap"><div class="progressBar" id="progressBar"></div></div><div class="progressText hidden" id="progressText"><span id="progressLabel">準備中</span><span id="progressPercent">0%</span></div><div id="status" class="status">請先上傳自拍照並選擇眼鏡款式。</div></section>
      <section class="card result"><div class="step"><div class="num">4</div><h2>我的產出紀錄</h2></div><div id="resultBox" class="empty">尚無產出紀錄。產生成功後，這裡會保留預覽與下載按鈕。</div></section>
    </div>
  </main>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const STORAGE_KEY = "klink_ai_wear_state_v2";
    let state = { settings:{}, models:[], selected:"", selfie:null, series:"全部", results:[], progressTimer:null, auth:{ idToken:"", displayName:"", userId:"", pictureUrl:"", points:null } };
    function esc(text){return String(text||"").replace(/[&<>"']/g,(m)=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
    function setStatus(text, ok){const el=$("status"); el.textContent=text||""; el.className="status"+(ok===true?" ok":ok===false?" bad":"");}
    function readLocal(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}"); if(saved && typeof saved==="object"){state.selfie=saved.selfie||null; state.results=Array.isArray(saved.results)?saved.results.slice(0,20):[];}}catch(_err){}}
    function saveLocal(){localStorage.setItem(STORAGE_KEY, JSON.stringify({ selfie:state.selfie, results:state.results.slice(0,20) }));}
    function modelSeries(model){return String(model.series||model.title||"未分類").replace(/負離子|眼鏡|系列|MODEL/gi,"").trim() || "未分類";}
    function currentModel(){return state.models.find((m)=>m.id===state.selected)||null;}
    async function initLineLogin(){
      const liffId = String(state.settings.liffId || "2007221311-ISFxRBY3").trim();
      if(!liffId || !window.liff){return;}
      try{
        await liff.init({ liffId });
        if(!liff.isLoggedIn()){
          setStatus("請先用 LINE 登入，系統需要確認會員 UID 才能扣點。", true);
          liff.login({ redirectUri: location.href });
          return new Promise(()=>{});
        }
        const profile = await liff.getProfile().catch(()=>null);
        const idToken = liff.getIDToken() || "";
        state.auth = { idToken, displayName: profile && profile.displayName ? profile.displayName : "", userId: profile && profile.userId ? profile.userId : "", pictureUrl: profile && profile.pictureUrl ? profile.pictureUrl : "", points:null }; renderMember();
      }catch(err){
        if(state.settings.pointDeductionEnabled){throw new Error("LINE 登入初始化失敗，請用 LINE 重新開啟頁面。");}
      }
    }
    function seriesIntro(series){const text=String(series||""); if(text.includes("3"))return"3 系列主打輕盈俐落，適合日常、上班與長時間配戴。"; if(text.includes("5"))return"5 系列線條醒目，適合想提升臉部輪廓與穿搭辨識度的人。"; if(text.includes("7"))return"7 系列造型感較強，適合想做出個人風格的配戴者。"; if(text.includes("8"))return"8 系列偏穩重百搭，適合商務與成熟穿搭。"; if(text.includes("9"))return"9 系列適合重視舒適度與視覺修飾的日常配戴。"; if(text.includes("10"))return"10 系列款式更完整，適合先試戴比較臉型比例。"; return"請選擇喜歡的鏡框，系統會依人物照片與眼鏡參考圖產生試戴效果。";}
    function renderMember(){const box=$("memberBox"); if(!box)return; const name=state.auth.displayName||"LINE 會員"; box.classList.remove("hidden"); $("memberName").textContent=name; $("memberPoints").textContent=state.auth.points===null?"K點讀取中":`目前 ${state.auth.points} K點`; const avatar=$("memberAvatar"); if(state.auth.pictureUrl){avatar.src=state.auth.pictureUrl;} else {avatar.removeAttribute("src"); avatar.alt=name.slice(0,1)||"LINE";}}
    async function loadMemberPoints(){if(!state.auth.idToken)return; const res=await fetch("/api/ai-wear/member-points",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({idToken:state.auth.idToken,displayName:state.auth.displayName,pictureUrl:state.auth.pictureUrl})}); const json=await res.json().catch(()=>({})); if(!res.ok||json.status!=="success")throw new Error(json.message||"K點讀取失敗"); const data=json.data||{}; state.auth.points=Number(data.balance||0); if(data.displayName)state.auth.displayName=data.displayName; if(data.pictureUrl)state.auth.pictureUrl=data.pictureUrl; renderMember();}
    async function loadPublic(){setStatus("讀取設定與素材庫...", true); const res=await fetch("/api/ai-wear-public",{cache:"no-store"}); const json=await res.json().catch(()=>({})); if(!res.ok||json.status!=="success")throw new Error(json.message||"AI穿戴資料載入失敗"); state.settings=json.data.settings||{}; await initLineLogin(); await loadMemberPoints().catch((err)=>{state.auth.points=null; renderMember(); console.warn("K點讀取失敗", err);}); state.models=json.data.gallery||[]; $("title").textContent=state.settings.title||"康立負離子眼鏡系列"; const cost=Number(state.settings.pointCost||0); $("subtitle").textContent=state.settings.pointDeductionEnabled&&cost>0?`上傳自拍照，選擇眼鏡款式，每次生成扣 ${cost} K點。`:"上傳自拍照，選擇 MODEL，AI 會產生試戴圖片。"; renderTabs(); renderModels(); renderSelectedIntro(); renderSelfie(); renderResults(); setStatus(state.models.length?"請上傳自拍照並選擇眼鏡款式。":"素材庫尚無眼鏡款式，請先到後台上傳。", state.models.length?null:false);}
    function renderTabs(){const series=["全部",...Array.from(new Set(state.models.map(modelSeries).filter(Boolean))).sort((a,b)=>a.localeCompare(b,"zh-Hant"))]; if(!series.includes(state.series))state.series="全部"; $("seriesTabs").innerHTML=series.map((s)=>`<button class="tab ${state.series===s?'active':''}" type="button" data-series="${esc(s)}">${esc(s)}</button>`).join(""); $("seriesTabs").querySelectorAll(".tab").forEach((btn)=>btn.onclick=()=>{state.series=btn.dataset.series; renderTabs(); renderModels();});}
    function renderModels(){const box=$("models"); const items=state.series==="全部"?state.models:state.models.filter((m)=>modelSeries(m)===state.series); if(!state.models.length){box.innerHTML='<div class="empty">素材庫尚無眼鏡款式。</div>';return;} if(!items.length){box.innerHTML='<div class="empty">此系列暫無款式。</div>';return;} box.innerHTML=items.map((m)=>`<button class="model ${state.selected===m.id?'active':''}" type="button" data-id="${esc(m.id)}"><img src="${esc(m.url)}" alt="${esc(m.title)}"><strong>${esc(m.title||'MODEL')}</strong><span>${esc(modelSeries(m))}</span></button>`).join(""); box.querySelectorAll(".model").forEach((btn)=>btn.onclick=()=>{state.selected=btn.dataset.id; renderModels(); renderSelectedIntro();});}
    function renderSelectedIntro(){const model=currentModel(); const box=$("selectedIntro"); if(!model){box.className="selectedIntro hidden"; box.textContent=""; return;} const s=modelSeries(model); box.className="selectedIntro"; box.innerHTML=`<strong>${esc(model.title||s)}</strong><br>${esc(seriesIntro(s))}`;}
    function renderSelfie(){const img=$("personPreview"); const badge=$("selfieBadge"); if(state.selfie && state.selfie.url){img.src=state.selfie.url; img.style.display="block"; badge.className="pill"; badge.textContent="自拍已保存，可直接生成";} else {badge.className="pill hidden"; badge.textContent="";}}
    function renderResults(){const box=$("resultBox"); if(!state.results.length){box.className="empty"; box.textContent="尚無產出紀錄。產生成功後，這裡會保留預覽與下載按鈕。"; return;} box.className="resultGrid"; box.innerHTML=state.results.map((r)=>`<article class="resultItem"><img src="${esc(r.result_url)}" alt="${esc(r.model_title||'AI試戴結果')}"><strong>${esc(r.model_title||'AI試戴結果')}</strong><p>${esc(r.created_at||'')}</p><p><a class="secondary" href="${esc(r.result_url)}" download="ai-wear-result.png">下載圖片</a></p></article>`).join("");}
    function setProgress(percent,label){$("progressWrap").classList.remove("hidden");$("progressText").classList.remove("hidden");$("progressBar").style.width=`${Math.max(0,Math.min(100,percent))}%`;$("progressPercent").textContent=`${Math.round(percent)}%`;$("progressLabel").textContent=label||"生成中";}
    function startProgress(){clearInterval(state.progressTimer);let p=8;setProgress(p,"送出自拍與眼鏡素材");state.progressTimer=setInterval(()=>{p=Math.min(92,p+(p<45?7:p<75?4:1.5));setProgress(p,p<45?"確認原圖與 MODEL":p<75?"AI 試戴生成中":"整理生成結果");},900);}
    function stopProgress(done){clearInterval(state.progressTimer);state.progressTimer=null;if(done){setProgress(100,"完成");setTimeout(()=>{$("progressWrap").classList.add("hidden");$("progressText").classList.add("hidden");},900);}}
    function blobFromCanvas(canvas, type, quality){return new Promise((resolve,reject)=>canvas.toBlob((blob)=>blob?resolve(blob):reject(new Error("照片壓縮失敗")), type, quality));}
    async function normalizeSelfieFile(file){
      const maxUploadBytes = 950 * 1024;
      const maxSide = 1280;
      const sourceUrl = URL.createObjectURL(file);
      try{
        const img = await new Promise((resolve,reject)=>{const image=new Image(); image.onload=()=>resolve(image); image.onerror=()=>reject(new Error("照片讀取失敗")); image.src=sourceUrl;});
        const scale = Math.min(1, maxSide / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
        const width = Math.max(1, Math.round((img.naturalWidth || img.width) * scale));
        const height = Math.max(1, Math.round((img.naturalHeight || img.height) * scale));
        if(file.size <= maxUploadBytes && scale >= 1 && /image\/(jpeg|png|webp)/i.test(file.type||"")) return file;
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d", { alpha:false });
        ctx.drawImage(img, 0, 0, width, height);
        let quality = 0.9;
        let blob = await blobFromCanvas(canvas, "image/jpeg", quality);
        while(blob.size > maxUploadBytes && quality > 0.52){ quality -= 0.08; blob = await blobFromCanvas(canvas, "image/jpeg", quality); }
        const baseName = String(file.name || "selfie").replace(/\.[^.]+$/, "");
        return new File([blob], `${baseName}-aiwear.jpg`, { type:"image/jpeg", lastModified:Date.now() });
      } finally {
        URL.revokeObjectURL(sourceUrl);
      }
    }
    async function uploadSelfie(file){setStatus("自拍處理中，解析度過高會自動降低後再上傳...", true); const normalized=await normalizeSelfieFile(file); const form=new FormData(); form.append("action","wetw_ai_hair_upload_selfie"); form.append("post_id","ai-wear"); if(state.auth.idToken)form.append("idToken",state.auth.idToken); if(state.auth.displayName)form.append("displayName",state.auth.displayName); form.append("selfie", normalized, normalized.name||"selfie.jpg"); const res=await fetch("/api/ai-wear/upload-selfie",{method:"POST",body:form}); const json=await res.json().catch(()=>({})); if(!res.ok||json.status!=="success")throw new Error(json.message||"自拍上傳失敗"); state.selfie=json.data.selfie; saveLocal(); renderSelfie(); const savedSize=normalized.size?`，檔案約 ${Math.round(normalized.size/1024)} KB`:""; setStatus(`自拍已保存${savedSize}，請選擇眼鏡款式。`, true);}
    function buildGenerateForm(model){const form=new FormData(); form.append("action","wetw_ai_hair_generate"); form.append("post_id","ai-wear"); form.append("selfie_media_id", state.selfie.media_id); form.append("selfie_url", state.selfie.url||""); if(state.auth.idToken)form.append("idToken",state.auth.idToken); if(state.auth.displayName)form.append("displayName",state.auth.displayName); form.append("model_id", model.id); form.append("model_title", model.title||""); form.append("model_image_url", model.url||""); form.append("model_product_url", model.productUrl||model.product_url||""); return form;}
    async function postFormJson(url, form, timeoutMs){const controller=typeof AbortController!=="undefined"?new AbortController():null; const timer=controller?setTimeout(()=>controller.abort(), timeoutMs):null; try{const res=await fetch(url,{method:"POST",body:form,signal:controller?controller.signal:undefined}); const json=await res.json().catch(()=>({})); if(!res.ok||json.status!=="success")throw new Error(json.message||(url.includes("preflight")?"生成前檢查失敗":"生成失敗")); return json;}catch(err){if(err&&err.name==="AbortError")throw new Error(timeoutMs<=30000?"生成前檢查逾時，請確認網路後再試。":"產圖服務超過 120 秒沒有回應，請稍後查看產出紀錄；不要連續重複送出。若沒有產出再重試。"); throw err;}finally{if(timer)clearTimeout(timer);}}
    async function generate(){const model=currentModel(); if(!state.selfie||!state.selfie.media_id){setStatus("請先上傳自拍照。", false);return;} if(!model){setStatus("請先選擇眼鏡款式。", false);return;} if(state.settings.pointDeductionEnabled&&!state.auth.idToken){setStatus("請先用 LINE 登入後再生成，系統需要確認會員 UID 才能扣點。", false);return;} const button=$("generate"); const old=button.textContent; try{button.disabled=true; button.textContent="檢查中..."; $("progressWrap").classList.add("hidden"); $("progressText").classList.add("hidden"); setStatus("正在檢查自拍、眼鏡款式、LINE 登入、K點與 image2 設定...", true); const check=await postFormJson("/api/ai-wear/preflight", buildGenerateForm(model), 20000); const checkData=check.data||{}; if(typeof checkData.balance==="number"){state.auth.points=checkData.balance; renderMember();} button.textContent="生成中..."; startProgress(); setStatus(`檢查通過，開始 AI 試戴生成。通常需要 30-90 秒，請勿關閉頁面。`, true); const json=await postFormJson("/api/ai-wear/generate", buildGenerateForm(model), 120000); const data=json.data||{}; const result=data.result||{}; const resultUrl=result.url||data.resultUrl||data.inlineDataUrl; if(!resultUrl)throw new Error("AI 未回傳圖片。"); state.selfie=data.selfie||state.selfie; state.results.unshift({model_id:model.id,model_title:model.title||"MODEL",model_image_url:model.url||"",result_media_id:result.media_id||data.id,result_url:resultUrl,created_at:result.created_at||new Date().toLocaleString("zh-TW")}); state.results=state.results.slice(0,20); saveLocal(); renderSelfie(); renderResults(); await loadMemberPoints().catch(()=>{}); stopProgress(true); setStatus(data.persistedImage===false?"生成完成。圖片已可下載；因圖片較大，系統只保存本次結果資訊。":"生成完成，結果已保存。", true);}catch(err){stopProgress(false);setStatus(err.message||String(err), false);}finally{button.disabled=false;button.textContent=old;}}    $("choosePerson").onclick=()=>$("personFile").click();
    $("personFile").onchange=async(e)=>{const file=e.target.files&&e.target.files[0]; if(!file)return; const img=$("personPreview"); img.src=URL.createObjectURL(file); img.style.display="block"; try{await uploadSelfie(file);}catch(err){setStatus(err.message||String(err), false);}};
    $("reload").onclick=()=>loadPublic().catch((err)=>setStatus(err.message||String(err), false));
    $("generate").onclick=generate;
    readLocal(); renderSelfie(); renderResults(); loadPublic().catch((err)=>setStatus(err.message||String(err), false));
  </script>
</body>
