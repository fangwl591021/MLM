<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>康立智能 NFC 贈K點</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root{--line:#06c755;--ink:#111827;--muted:#667085;--red:#e11d48;--soft:#f7fafc}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#fff;color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top));padding-bottom:calc(24px + env(safe-area-inset-bottom))}
    main{width:min(320px,100%);text-align:center}
    .mark{width:64px;height:64px;margin:0 auto 18px;border-radius:18px;background:var(--line);display:grid;place-items:center;color:#fff;font-size:24px;font-weight:900;box-shadow:0 16px 38px rgba(6,199,85,.22)}
    .spinner{width:36px;height:36px;margin:0 auto 16px;border:4px solid #dff7e9;border-top-color:var(--line);border-radius:50%;animation:spin .8s linear infinite}
    h1{margin:0;font-size:22px;line-height:1.35;font-weight:900}
    p{margin:10px 0 0;color:var(--muted);font-size:15px;line-height:1.6}
    .packet{width:96px;height:116px;margin:0 auto 18px;border-radius:18px 18px 26px 26px;background:linear-gradient(180deg,#ff3b30,#c1121f);position:relative;box-shadow:0 18px 42px rgba(225,29,72,.25)}
    .packet:before{content:"";position:absolute;left:50%;top:42px;width:42px;height:42px;border-radius:50%;background:#ffd166;transform:translateX(-50%)}
    .packet:after{content:"5";position:absolute;left:50%;top:46px;transform:translateX(-50%);font-weight:900;font-size:24px;color:#8a1c13}
    .hidden{display:none}
    .error .mark{background:var(--red);box-shadow:0 16px 38px rgba(225,29,72,.18)}
    .error h1{color:var(--red)}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main id="app">
    <div id="loadingIcon" class="spinner"></div>
    <div id="successIcon" class="packet hidden"></div>
    <div id="plainIcon" class="mark hidden">KL</div>
    <h1 id="title">請稍後，系統處理中</h1>
    <p id="message">正在確認課程時間與會員資料</p>
  </main>

  <script>
    const API_BASE = "https://mlm.fangwl591021.workers.dev";
    const LIFF_ID = "2007221311-WjM9sZPz";
    const CLOSE_DELAY_MS = 2600;
    const qs = new URLSearchParams(location.search);
    const nested = new URLSearchParams(qs.get("liff.state") || "");
    const campaign = nested.get("campaign") || qs.get("campaign") || "calendar_auto";
    const entry = nested.get("entry") || qs.get("entry") || "nfc";

    const appEl = document.getElementById("app");
    const titleEl = document.getElementById("title");
    const messageEl = document.getElementById("message");
    const loadingIconEl = document.getElementById("loadingIcon");
    const successIconEl = document.getElementById("successIcon");
    const plainIconEl = document.getElementById("plainIcon");

    boot();

    async function boot() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: location.href });
          return;
        }
        await claim();
      } catch (error) {
        renderClosed("目前非課程時間，請查看行事曆", "", true);
      }
    }

    async function claim() {
      renderLoading();
      const idToken = liff.getIDToken();
      if (!idToken) throw new Error("missing token");
      const position = await getCurrentPosition();
      const response = await fetch(`${API_BASE}/api/reward/claim`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          campaign,
          entry,
          idToken,
          lat: position.coords.latitude,
          lng: position.coords.longitude,
          accuracy: position.coords.accuracy,
        }),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || data.status !== "success") {
        const message = data.message || "";
        if (message.includes("有效活動") || message.includes("日曆") || message.includes("距離") || message.includes("定位")) {
          renderClosed("目前非課程時間，請查看行事曆", "", true);
          return;
        }
        throw new Error(message || "claim failed");
      }
      renderSuccess(data.duplicate ? "已領取過本課程紅包" : "紅包已送出", data.duplicate ? "本課程已完成領取" : "已發送 5 K點");
    }

    function renderLoading() {
      appEl.classList.remove("error");
      loadingIconEl.classList.remove("hidden");
      successIconEl.classList.add("hidden");
      plainIconEl.classList.add("hidden");
      titleEl.textContent = "請稍後，系統處理中";
      messageEl.textContent = "正在確認課程時間與會員資料";
    }

    function renderSuccess(title, message) {
      appEl.classList.remove("error");
      loadingIconEl.classList.add("hidden");
      successIconEl.classList.remove("hidden");
      plainIconEl.classList.add("hidden");
      titleEl.textContent = title;
      messageEl.textContent = message;
      closeSoon();
    }

    function renderClosed(title, message, isError) {
      appEl.classList.toggle("error", Boolean(isError));
      loadingIconEl.classList.add("hidden");
      successIconEl.classList.add("hidden");
      plainIconEl.classList.remove("hidden");
      titleEl.textContent = title;
      messageEl.textContent = message;
      closeSoon();
    }

    function closeSoon() {
      setTimeout(() => {
        if (window.liff && liff.isInClient()) {
          liff.closeWindow();
          return;
        }
        window.close();
      }, CLOSE_DELAY_MS);
    }

    function getCurrentPosition() {
      if (!navigator.geolocation) return Promise.reject(new Error("no geolocation"));
      return new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(resolve, reject, {
          enableHighAccuracy: true,
          timeout: 12000,
          maximumAge: 0,
        });
      });
    }
  </script>
</body>
</html>
