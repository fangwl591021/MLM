<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LINE OA 管理後台</title>
  <style>
    :root{--line:#06c755;--ink:#111827;--muted:#6b7280;--border:#dfe5ec;--chat:#8fa9c4;--admin:#9ee86b;--warn:#f79009;--danger:#d92d20}*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;background:#fff;color:var(--ink);font-family:Inter,"Noto Sans TC",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}button,input,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:370px minmax(620px,1fr) 390px;height:100vh}.left,.chat,.assist{min-height:0;background:#fff}.left{border-right:1px solid var(--border)}.assist{border-left:1px solid var(--border);background:#fbfcfe}.brand{height:70px;display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}.oa{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:var(--line);color:#fff;font-weight:900}.brand h1,.room h2,.assist h2{margin:0;font-size:17px;line-height:1.2;font-weight:900}.brand p,.room p,.assist p{margin:4px 0 0;color:var(--muted);font-size:12px}.config{display:grid;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border);background:#f8fafc}.config label{color:#5d6675;font-size:12px;font-weight:800}.config input,.search input,textarea{width:100%;border:1px solid #d8dee8;background:#fff;outline:none}.config input{height:38px;border-radius:8px;padding:0 11px}.config input[type=file]{height:auto;padding:8px}.config button{height:36px;border:1px solid #b6ecc8;border-radius:8px;background:#effcf4;color:#067a35;font-weight:900}.knowledgeStatus{min-height:16px;color:#6b7280;font-size:12px;line-height:1.35}.search{padding:14px 16px;border-bottom:1px solid var(--border)}.search input{height:40px;border-radius:999px;padding:0 15px;background:#f4f7fa}.config input:focus,.search input:focus,textarea:focus{border-color:var(--line);box-shadow:0 0 0 3px rgba(6,199,85,.12)}.list{height:calc(100vh - 70px - 250px - 69px);overflow:auto}.item{width:100%;display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;padding:16px;border:0;border-bottom:1px solid #edf1f5;background:#fff;text-align:left}.item:hover,.item.active{background:#ebfbf3}.item.active{box-shadow:inset 4px 0 0 var(--line)}.avatar{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;background:#e4ebf3;color:#233044;font-weight:900}.avatar.named{background:#dff8e9;color:#057a36}.line{display:flex;justify-content:space-between;gap:8px;min-width:0}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:900}.time{color:var(--muted);font-size:11px;white-space:nowrap}.uid{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#7a8492;font-size:11px}.preview{margin-top:5px;overflow:hidden;color:#4b5563;font-size:13px;text-overflow:ellipsis;white-space:nowrap}.tags{display:flex;gap:6px;margin-top:8px}.tag{border-radius:999px;padding:3px 8px;background:#eef2f7;color:#536072;font-size:11px;font-weight:800}.tag.hot{background:#fff1f3;color:#c01048}.chat{display:grid;grid-template-rows:70px auto minmax(0,1fr) auto}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);background:#fff}.actions{display:flex;align-items:center;gap:8px}.pill{border:1px solid #b6ecc8;border-radius:999px;padding:6px 10px;background:#effcf4;color:#07833b;font-size:12px;font-weight:900}.pill.bad{border-color:#fecdd3;background:#fff1f3;color:var(--danger)}.refresh{width:38px;height:38px;border:1px solid #d8dee8;border-radius:10px;background:#fff;color:#4b5563}.error{margin:0;padding:9px 18px;border-bottom:1px solid #fecdd3;background:#fff1f3;color:var(--danger);font-size:12px;font-weight:800}.messages{overflow:auto;padding:24px 34px;background:linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.10) 1px,transparent 1px),var(--chat);background-size:36px 36px}.day{width:max-content;margin:0 auto 18px;border-radius:999px;padding:6px 13px;background:rgba(255,255,255,.58);color:#45505d;font-size:12px;font-weight:900}.msg{display:flex;margin:0 0 16px}.msg.admin{justify-content:flex-end}.wrap{max-width:min(680px,78%)}.bubble{padding:11px 14px;border-radius:6px 18px 18px 18px;background:#fff;color:#111827;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 1px rgba(20,30,45,.08)}.admin .bubble{border-radius:18px 6px 18px 18px;background:var(--admin)}.meta{margin-top:5px;color:rgba(31,35,41,.68);font-size:11px;font-weight:700}.admin .meta{text-align:right}.composer{border-top:1px solid var(--border);background:#fff}.suggestions{display:flex;gap:8px;min-height:50px;padding:10px 16px;overflow-x:auto;border-bottom:1px solid #edf1f5;background:#f8fcf9}.suggestions button{flex:0 0 auto;max-width:520px;border:1px solid #91deb0;border-radius:999px;padding:8px 13px;background:#fff;color:#067a35;font-size:13px;font-weight:850;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sendrow{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:12px;padding:12px 16px;align-items:end}textarea{min-height:48px;max-height:140px;resize:vertical;border-radius:12px;padding:12px;background:#fbfcfd;line-height:1.45}.send{width:48px;height:48px;border:0;border-radius:50%;background:var(--line);color:#fff;font-size:18px;font-weight:900}.assistHead{height:70px;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);background:#fff}.assistBody{height:calc(100vh - 70px);overflow:auto;padding:16px}.card{margin-bottom:13px;border:1px solid var(--border);border-radius:12px;background:#fff;overflow:hidden}.cardTitle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border-bottom:1px solid #edf1f5;font-size:14px;font-weight:900}.cardBody{padding:13px 14px}.sideList{display:grid;gap:9px}.sideBtn{border:1px solid #d9f2e2;border-radius:10px;padding:11px;background:#fbfffc;color:#26303d;line-height:1.48;text-align:left}.alert{margin-bottom:10px;border:1px solid #ffd9b2;border-left:4px solid var(--warn);border-radius:10px;padding:11px;background:#fff7ed}.alert strong{display:block;margin-bottom:6px;color:#9a3412;font-size:13px}.alert p{margin:0 0 8px;color:#374151;line-height:1.45}.muted{color:var(--muted);font-size:12px;line-height:1.55}@media(max-width:1100px){body{overflow:auto}.app{grid-template-columns:350px minmax(620px,1fr);width:max-content}.assist{display:none}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="left"><header class="brand"><div class="oa">OA</div><div><h1>LINE OA 管理後台</h1><p>AI 建議模式，不自動回覆</p></div></header><section class="config"><label for="apiBase">Worker API URL</label><input id="apiBase" placeholder="https://mlm.fangwl591021.workers.dev" /><label for="apiToken">Dashboard Token</label><input id="apiToken" type="password" placeholder="輸入後同步聊天室" /><label for="knowledgeFile">知識庫 JSON</label><input id="knowledgeFile" type="file" accept=".json,application/json" /><button id="uploadKnowledge" type="button">上傳知識庫</button><div id="knowledgeStatus" class="knowledgeStatus">支援陣列格式，或含 version/items 的包裝格式。</div></section><div class="search"><input id="searchBox" placeholder="搜尋聊天、用戶名稱、用戶 ID、分類" /></div><div id="chatList" class="list"></div></aside>
    <main class="chat"><header class="head"><div class="room"><h2 id="activeTitle">請選擇 LINE 對話</h2><p id="activeSubtitle">AI 建議僅供管理員參考</p></div><div class="actions"><span class="pill" id="syncStatus">同步中</span><button class="refresh" id="refreshButton">↻</button></div></header><div id="errorBox"></div><section id="messages" class="messages"></section><footer class="composer"><div id="suggestions" class="suggestions"></div><div class="sendrow"><textarea id="replyText" placeholder="點選 AI 建議或手動輸入，按送出後才會回覆 LINE 用戶"></textarea><button id="sendButton" class="send">➤</button></div></footer></main>
    <aside class="assist"><header class="assistHead"><div><h2>AI 助理</h2><p>僅提供管理員參考</p></div><span class="pill">建議中</span></header><div class="assistBody"><section class="card"><div class="cardTitle"><span>最新建議回覆</span><span class="time" id="suggestionCount">0</span></div><div class="cardBody"><div id="sideSuggestions" class="sideList"></div></div></section><section class="card"><div class="cardTitle"><span>重要訊息通報</span><span class="time" id="alertCount">0</span></div><div class="cardBody" id="alertList"></div></section><section class="card"><div class="cardTitle">系統原則</div><div class="cardBody muted">LINE webhook 只做紀錄與 AI 判斷。系統不會自動回覆客戶，只有管理員按下送出才會推送 LINE 訊息。客訴、負評、建議與重大風險會發送 Telegram 通知。</div></section></div></aside>
  </div>
  <script>
    const DEFAULT_API_BASE='https://mlm.fangwl591021.workers.dev';
    const demoChats=[{'時間':Date.now()-420000,'身份':'user','用戶ID':'Udemo001','用戶名稱':'王小明','內容':'包裝破損如何更換？','類別':'退換貨作業','AI建議':JSON.stringify(['很抱歉造成您的困擾，請您先保留外盒與商品照片，我們會協助確認物流破損與換貨流程。','若是宅配破損，請提供收貨時間、照片與訂單資訊，我們會盡快協助後續處理。']),'重要':'是','情緒':'complaint','狀態':'待處理'},{'時間':Date.now()-180000,'身份':'user','用戶ID':'Udemo002','用戶名稱':'陳小姐','內容':'康美霜用法？','類別':'產品總覽','AI建議':JSON.stringify(['您好，康美霜屬於康立補系列產品。建議先依產品標示與個人膚況使用，如有敏感或不適請先停止並諮詢專業人員。']),'重要':'否','情緒':'neutral','狀態':'待回覆'}];
    const demoLogs=[{'時間':Date.now()-420000,'用戶ID':'Udemo001','用戶名稱':'王小明','內容':'包裝破損如何更換？','類別':'客訴 / 物流破損','情緒':'complaint','原因':'含破損與換貨需求，需人工關注。','狀態':'待處理','TG通知':'Demo'}];
    const $=id=>document.getElementById(id);
    const els={apiBase:$('apiBase'),apiToken:$('apiToken'),knowledgeFile:$('knowledgeFile'),uploadKnowledge:$('uploadKnowledge'),knowledgeStatus:$('knowledgeStatus'),searchBox:$('searchBox'),chatList:$('chatList'),messages:$('messages'),suggestions:$('suggestions'),sideSuggestions:$('sideSuggestions'),suggestionCount:$('suggestionCount'),replyText:$('replyText'),sendButton:$('sendButton'),refreshButton:$('refreshButton'),activeTitle:$('activeTitle'),activeSubtitle:$('activeSubtitle'),syncStatus:$('syncStatus'),alertList:$('alertList'),alertCount:$('alertCount'),errorBox:$('errorBox')};
    const state={chats:demoChats,aiLogs:demoLogs,activeUserId:'',isDemo:true};
    els.apiBase.value=sanitizeApiBase(localStorage.getItem('line_ai_api_base')||DEFAULT_API_BASE);els.apiToken.value=localStorage.getItem('line_ai_api_token')||'';els.apiBase.addEventListener('change',saveSettings);els.apiToken.addEventListener('change',saveSettings);els.searchBox.addEventListener('input',render);els.refreshButton.addEventListener('click',sync);els.sendButton.addEventListener('click',sendReply);els.uploadKnowledge.addEventListener('click',uploadKnowledge);setInterval(sync,5000);render();sync();
    function saveSettings(){els.apiBase.value=sanitizeApiBase(els.apiBase.value);localStorage.setItem('line_ai_api_base',els.apiBase.value);localStorage.setItem('line_ai_api_token',els.apiToken.value.trim());sync()}
    async function sync(){const base=apiBase(),token=els.apiToken.value.trim();if(!base||!token){state.chats=demoChats;state.aiLogs=demoLogs;state.isDemo=true;setStatus('Demo 模式');clearError();render();return}try{setStatus('同步中');const res=await fetch(`${base}/api/data`,{headers:{Authorization:`Bearer ${token}`}});const json=await res.json();if(!res.ok||json.status!=='success')throw new Error(json.message||'同步失敗');state.chats=Array.isArray(json.data.chats)?json.data.chats:[];state.aiLogs=Array.isArray(json.data.aiLogs)?json.data.aiLogs:[];state.isDemo=false;setStatus('已同步');clearError();if(json.data.knowledgeMeta&&json.data.knowledgeMeta.count)els.knowledgeStatus.textContent=`目前知識庫 ${json.data.knowledgeMeta.count} 筆${json.data.knowledgeMeta.version?' · '+json.data.knowledgeMeta.version:''}`;render()}catch(err){setStatus('同步失敗',true);showError(err.message||String(err))}}
    async function uploadKnowledge(){const file=els.knowledgeFile.files&&els.knowledgeFile.files[0];const token=els.apiToken.value.trim();if(!file){els.knowledgeStatus.textContent='請先選擇 JSON 檔。';return}if(!token){els.knowledgeStatus.textContent='請先輸入 Dashboard Token。';return}try{els.uploadKnowledge.disabled=true;els.knowledgeStatus.textContent='讀取 JSON 中';const text=await file.text();const knowledge=JSON.parse(text);const count=validateKnowledge(knowledge);els.knowledgeStatus.textContent=`準備上傳 ${count} 筆`;const res=await fetch(`${apiBase()}/api/knowledge`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({knowledge,fileName:file.name})});const json=await res.json();if(!res.ok||json.status!=='success')throw new Error(json.message||'知識庫上傳失敗');els.knowledgeStatus.textContent=`已匯入 ${json.count||count} 筆知識庫`;await sync()}catch(err){els.knowledgeStatus.textContent=err.message||String(err)}finally{els.uploadKnowledge.disabled=false}}
    function validateKnowledge(payload){const items=Array.isArray(payload)?payload:(payload&&Array.isArray(payload.items)?payload.items:[]);if(!items.length)throw new Error('JSON 必須是問答陣列，或包含 items 陣列。');items.forEach((item,index)=>{if(!item||!(item.question||item.q||item['問題'])||!(item.answer||item.a||item['答案']))throw new Error(`第 ${index+1} 筆缺少 question/answer`)});return items.length}
    async function sendReply(){const text=els.replyText.value.trim();if(!text||!state.activeUserId)return;const current=currentGroup();if(state.isDemo||!els.apiToken.value.trim()){state.chats.push({'時間':Date.now(),'身份':'admin','用戶ID':state.activeUserId,'用戶名稱':current?current.displayName:'','內容':text,'類別':'Demo 回覆','AI建議':'','重要':'否','情緒':'neutral','狀態':'已回覆'});els.replyText.value='';render();return}try{els.sendButton.disabled=true;const res=await fetch(`${apiBase()}/api/send`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${els.apiToken.value.trim()}`},body:JSON.stringify({userId:state.activeUserId,text,userName:current?current.displayName:''})});const json=await res.json();if(!res.ok||json.status!=='success')throw new Error(json.message||'送出失敗');els.replyText.value='';await sync()}catch(err){showError(err.message||String(err))}finally{els.sendButton.disabled=false}}
    function render(){const groups=groupRows(filteredRows());if(!state.activeUserId&&groups[0])state.activeUserId=groups[0].userId;renderList(groups);renderMessages(groups);renderAssistant(groups)}
    function filteredRows(){const q=els.searchBox.value.trim().toLowerCase();if(!q)return state.chats;return state.chats.filter(row=>[row['用戶名稱'],row['用戶ID'],row['內容'],row['類別'],row['狀態']].filter(Boolean).some(value=>String(value).toLowerCase().includes(q)))}
    function groupRows(rows){const map=new Map();rows.slice().sort((a,b)=>Number(a['時間']||0)-Number(b['時間']||0)).forEach(row=>{const id=row['用戶ID']||'unknown';if(!map.has(id))map.set(id,[]);map.get(id).push(row)});return Array.from(map.entries()).map(([userId,messages])=>{const last=messages[messages.length-1]||{};const displayName=nameFromMessages(messages,userId);return{userId,displayName,messages,last}}).sort((a,b)=>Number(b.last['時間']||0)-Number(a.last['時間']||0))}
    function renderList(groups){els.chatList.innerHTML=groups.map(group=>{const last=group.last||{},hot=group.messages.some(row=>row['重要']==='是'),active=group.userId===state.activeUserId?' active':'',named=group.displayName&&group.displayName!==group.userId;return `<button class="item${active}" data-id="${esc(group.userId)}"><div class="avatar ${named?'named':''}">${esc(initialOf(group.displayName))}</div><div><div class="line"><span class="name">${esc(group.displayName)}</span><span class="time">${fmt(last['時間'])}</span></div><div class="uid">${esc(group.userId)}</div><div class="preview">${esc(last['內容']||'')}</div><div class="tags"><span class="tag">${esc(last['類別']||'一般查詢')}</span>${hot?'<span class="tag hot">重要</span>':''}</div></div></button>`}).join('')||'<div class="muted" style="padding:18px">沒有符合的聊天。</div>';document.querySelectorAll('.item').forEach(btn=>btn.onclick=()=>{state.activeUserId=btn.dataset.id;render()})}
    function renderMessages(groups){const group=groups.find(item=>item.userId===state.activeUserId)||groups[0];if(!group){els.activeTitle.textContent='尚無對話';els.activeSubtitle.textContent='等待 LINE webhook 收到訊息';els.messages.innerHTML='<div class="day">尚無訊息</div>';return}state.activeUserId=group.userId;els.activeTitle.textContent=group.displayName;els.activeSubtitle.textContent=`共 ${group.messages.length} 則訊息 · 用戶ID ${group.userId}`;els.messages.innerHTML='<div class="day">今天</div>'+group.messages.map(row=>{const isAdmin=row['身份']==='admin';const meta=[fmt(row['時間']),row['類別']||'',row['重要']==='是'?'重要':''].filter(Boolean).join(' · ');return `<div class="msg ${isAdmin?'admin':'user'}"><div class="wrap"><div class="bubble">${esc(row['內容']||'')}</div><div class="meta">${esc(meta)}</div></div></div>`}).join('');els.messages.scrollTop=els.messages.scrollHeight;const suggestions=suggestionsFor(group);els.suggestions.innerHTML=suggestions.length?suggestions.map(text=>`<button data-suggestion="${esc(text)}">${esc(text)}</button>`).join(''):'<span class="muted">目前沒有 AI 建議</span>';document.querySelectorAll('[data-suggestion]').forEach(btn=>btn.onclick=()=>{els.replyText.value=btn.dataset.suggestion;els.replyText.focus()})}
    function renderAssistant(groups){const group=groups.find(item=>item.userId===state.activeUserId)||groups[0];const suggestions=group?suggestionsFor(group):[];els.suggestionCount.textContent=String(suggestions.length);els.sideSuggestions.innerHTML=suggestions.length?suggestions.map(text=>`<button class="sideBtn" data-side-suggestion="${esc(text)}">${esc(text)}</button>`).join(''):'<div class="muted">選擇對話後，AI 建議會顯示在這裡。</div>';document.querySelectorAll('[data-side-suggestion]').forEach(btn=>btn.onclick=()=>{els.replyText.value=btn.dataset.sideSuggestion;els.replyText.focus()});els.alertCount.textContent=String(state.aiLogs.length);els.alertList.innerHTML=state.aiLogs.length?state.aiLogs.map(row=>`<article class="alert"><strong>${esc(nameOf(row,row['用戶ID']))} · ${esc(row['類別']||'重要訊息')}</strong><p>${esc(row['內容']||'')}</p><div class="time">${esc(row['狀態']||'待處理')} · ${fmt(row['時間'])} · TG ${esc(row['TG通知']||'')}</div></article>`).join(''):'<div class="muted">目前沒有客訴、負評、建議或重大風險通報。</div>'}
    function currentGroup(){return groupRows(state.chats).find(item=>item.userId===state.activeUserId)}
    function suggestionsFor(group){const row=[...group.messages].reverse().find(item=>item['身份']==='user');if(!row)return[];try{const value=typeof row['AI建議']==='string'?JSON.parse(row['AI建議']):row['AI建議'];return Array.isArray(value)?value.filter(Boolean):[]}catch(_err){return[]}}
    function nameFromMessages(messages,fallback){for(let i=messages.length-1;i>=0;i-=1){const value=nameOf(messages[i],'');if(value&&value!==messages[i]['用戶ID'])return value}return String(fallback||'unknown')}
    function nameOf(row,fallback){const value=row&&(row['用戶名稱']||row.displayName||row.userName||row['姓名']);return String(value||fallback||'').trim()}
    function initialOf(name){return String(name||'U').trim().charAt(0).toUpperCase()||'U'}
    function apiBase(){const value=sanitizeApiBase(els.apiBase.value);if(value!==els.apiBase.value){els.apiBase.value=value;localStorage.setItem('line_ai_api_base',value)}return value}
    function sanitizeApiBase(value){const raw=String(value||'').trim().replace(/\/+$/,'');if(!raw||raw==='admin'||raw==='/admin')return DEFAULT_API_BASE;try{const url=new URL(raw,window.location.origin);const isStaticHost=url.hostname===window.location.hostname||url.hostname==='fangwl591021.github.io';if(isStaticHost||/\/admin$/i.test(url.pathname))return DEFAULT_API_BASE;return url.origin+url.pathname.replace(/\/+$/,'')}catch(_err){return DEFAULT_API_BASE}}
    function setStatus(text,bad){els.syncStatus.textContent=text;els.syncStatus.className=bad?'pill bad':'pill'}
    function showError(text){els.errorBox.innerHTML=text?`<p class="error">${esc(text)}</p>`:''}
    function clearError(){showError('')}
    function fmt(value){const n=Number(value);return n?new Date(n).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):''}
    function esc(value){return String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
  </script>
</body>
</html>
