<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DS PRO - Intelligent Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0"
        }
    }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: #f8fafc; color: #0f172a; margin: 0; overflow: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* 嚴格的 LINE 原生氣泡樣式 */
        .line-bubble-user { background-color: #ffffff; border-radius: 18px; position: relative; }
        .line-bubble-admin { background-color: #06c755; color: white; border-radius: 18px; position: relative; }
        
        /* 移除外框後的活動標籤 */
        .nav-active { background: #1e293b; color: white; }
        .animate-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            LayoutDashboard, MessageSquare, Calendar, BarChart, Bell, CheckCircle, 
            Search, Smartphone, Zap, Send, ShieldCheck, Lock, Activity, Settings, 
            ClipboardList, Plus, AlertTriangle, Sparkles, Bot, Clock
        } from 'lucide-react';

        // ⚠️ 填入您的 Worker 網址
        const WORKER_URL = "https://YOUR_WORKER_URL.workers.dev";

        const PermissionGate = ({ type, role, children }) => {
            const isAllowed = type === 'operate' ? role === 'admin' : true;
            return isAllowed ? children : (
                <div className="relative group cursor-not-allowed">
                    <div className="pointer-events-none opacity-60">{children}</div>
                    <div className="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity z-10">
                        <span className="bg-slate-900 text-white text-xs px-3 py-1.5 rounded-full font-bold shadow-xl flex items-center gap-1"><Lock size={14}/> 唯讀權限</span>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('chat');
            const [user] = useState({ name: '系統管理員', role: 'admin', dept: '決策層' });
            const [chatTarget, setChatTarget] = useState(null);
            const [inputText, setInputText] = useState('');
            const chatEndRef = useRef(null);

            // --- 實時數據 State ---
            const [messages, setMessages] = useState([
                { id: 1, userId: 'U8819', sender: 'user', text: '請問這個月的獎金計算方式有調整嗎？', time: '14:05', aiCategory: '獎金制度', aiSuggestions: ['本月制度無更動，可參考官網附件。', '您好，詳細撥款時間預計在15號。'] },
                { id: 2, userId: 'U8819', sender: 'admin', text: '您好，本月維持原獎金制度，若有變動會於官網公告。', time: '14:06' },
                { id: 3, userId: 'U1202', sender: 'user', text: 'NFC 報到感應沒反應，請問該怎麼處理？', time: '14:10', aiCategory: '硬體排除', aiSuggestions: ['請確認手機 NFC 功能已開啟。', '可以嘗試將手機靠近標籤中心點感應。', '若持續失敗，請手動輸入站點代碼。'] }
            ]);
            const [aiLogs, setAiLogs] = useState([
                { id: 1, type: 'critical', category: '重大問題', msg: '多位經銷商反應獎金結算數字異常，有群體客訴風險。', user: 'U8819', target: '核心決策組', time: '5m' },
                { id: 2, type: 'complaint', category: '物流延遲', msg: '發貨中心收到包裹破損反映，需查核物流狀況。', user: 'U1202', target: '客服應變組', time: '1h' },
                { id: 3, type: 'faq', category: '一般諮詢', msg: '詢問新產品「晶透精華」的具體提撥積分。', user: 'U5543', target: '一般記錄組', time: '3h' }
            ]);
            const [nfcCheckins, setNfcCheckins] = useState([
                { id: 1, name: '林大華', point: '總部大廳', time: '14:20' },
                { id: 2, name: '陳小美', point: 'VIP 接待區', time: '14:18' }
            ]);
            
            const [isSyncing, setIsSyncing] = useState(false);
            const [syncError, setSyncError] = useState(false);
            const failCount = useRef(0);

            // --- 自動拉取最新資料 (包含歷史紀錄) ---
            useEffect(() => {
                const fetchDashboardData = async () => {
                    if (!WORKER_URL || WORKER_URL.includes("YOUR_WORKER_URL") || failCount.current >= 3) {
                        if (failCount.current >= 3 && !syncError) setSyncError(true);
                        return;
                    }

                    try {
                        setIsSyncing(true);
                        const res = await fetch(`${WORKER_URL}/api/data`);
                        if (!res.ok) throw new Error(`HTTP status ${res.status}`);
                        const json = await res.json();
                        
                        if (json.status === "success" && json.data) {
                            // 這裡會把 Google Sheets 所有歷史對話拉回並呈現
                            const rawChats = json.data.chats || [];
                            const formattedMsgs = rawChats.map((r, i) => ({
                                id: i,
                                userId: r['用戶ID'] || 'Unknown',
                                sender: r['身份'] === 'admin' ? 'admin' : 'user',
                                text: r['內容'] || '',
                                aiCategory: r['類別'] || '',
                                aiSuggestions: r['AI建議'] ? JSON.parse(r['AI建議']) : null,
                                time: new Date(Number(r['時間'])).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                            })).reverse(); 
                            
                            setMessages(formattedMsgs.length > 0 ? formattedMsgs : messages);
                            
                            setAiLogs((json.data.aiLogs || []).map((r, i) => ({
                                id: i,
                                type: r['類別'] === '重大問題' ? 'critical' : 'complaint',
                                category: r['類別'] || '監看通報',
                                msg: r['原始訊息'],
                                target: r['類別'] === '重大問題' ? '核心決策組' : '營運追蹤組',
                                user: r['使用者ID'] || '用戶',
                                time: new Date(Number(r['時間'])).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                            })));

                            setNfcCheckins((json.data.nfcLogs || []).map((r, i) => ({
                                id: i,
                                name: r['使用者ID'] || '感應人員',
                                point: r['感應點'] || '未知站點',
                                time: new Date(Number(r['時間'])).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                            })));
                            
                            failCount.current = 0;
                            setSyncError(false);
                        }
                    } catch (err) {
                        failCount.current += 1;
                        if (failCount.current >= 3) setSyncError(true);
                    } finally {
                        setIsSyncing(false);
                    }
                };

                fetchDashboardData();
                const interval = setInterval(fetchDashboardData, 5000);
                return () => clearInterval(interval);
            }, [syncError, messages]);

            // 整理左側對話名單
            const chatList = useMemo(() => {
                const map = new Map();
                messages.forEach(m => {
                    map.set(m.userId, { 
                        id: m.userId, 
                        name: m.userId.substring(0,6),
                        lastMsg: m.text, 
                        time: m.time, 
                        unread: 0, 
                        status: 'online' 
                    });
                });
                return Array.from(map.values());
            }, [messages]);

            const activeMessage = useMemo(() => {
                if (!chatTarget) return null;
                const userMsgs = messages.filter(m => m.userId === chatTarget.id && m.sender === 'user');
                return userMsgs[userMsgs.length - 1]; 
            }, [messages, chatTarget]);

            const [staffMatrix] = useState([
                { id: 'S01', name: '張經理', dept: '行政部', canOperate: true, tgTarget: '核心警報組' },
                { id: 'S02', name: '林組長', dept: '客服部', canOperate: false, tgTarget: '客服應變組' }
            ]);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [messages, chatTarget]);

            const handleSend = async () => {
                if (!inputText || !chatTarget) return;
                
                const tempMsg = {
                    id: Date.now(),
                    userId: chatTarget.id,
                    sender: 'admin',
                    text: inputText,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };
                setMessages(prev => [...prev, tempMsg]);
                setInputText('');

                if (WORKER_URL.includes("YOUR_WORKER_URL") || syncError) return;

                try {
                    await fetch(`${WORKER_URL}/api/send`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: chatTarget.id, text: inputText })
                    });
                } catch (e) {
                    console.error("發送失敗", e);
                }
            };

            // ==========================================
            // 視圖渲染區
            // ==========================================

            const renderOverview = () => (
                <div className="p-8 space-y-6 animate-in font-sans h-full overflow-y-auto bg-slate-50">
                    <div className="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        <StatCard title="營運總額" value="12.4M" change="+12%" icon={BarChart} color="blue" />
                        <StatCard title="AI 異常" value={aiLogs.length} change="待處理" icon={AlertTriangle} color="red" />
                        <StatCard title="簽到人次" value={nfcCheckins.length} change="實時同步" icon={Smartphone} color="green" />
                        <StatCard title="部門行程" value="4" change="本週計" icon={ClipboardList} color="purple" />
                    </div>

                    <div className="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-2 bg-white rounded-xl border border-slate-200 shadow-sm p-8 flex flex-col">
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="font-bold text-[16px] text-slate-900 flex items-center gap-2">
                                    <Zap size={22} className="text-orange-500 fill-orange-500" /> AI 靜默監測報表
                                </h3>
                                <span className={`text-xs font-bold px-3 py-1 rounded-full flex items-center gap-2 transition-colors ${syncError ? 'bg-red-50 text-red-600' : 'bg-green-50 text-green-700'}`}>
                                    {!syncError && <div className={`w-2 h-2 rounded-full ${isSyncing ? 'bg-green-500 animate-pulse' : 'bg-green-500'}`}></div>}
                                    {syncError && <AlertTriangle size={14} />}
                                    {syncError ? 'SYNC ERROR' : (isSyncing ? 'SYNCING...' : 'LIVE')}
                                </span>
                            </div>
                            <div className="space-y-4 max-h-[400px] overflow-y-auto custom-scrollbar pr-3">
                                {aiLogs.length === 0 ? <p className="text-slate-500 text-sm text-center py-10">尚無異常監控紀錄</p> : aiLogs.map((log, i) => (
                                    <div key={i} className="p-5 bg-white border border-slate-200 rounded-lg hover:border-slate-400 transition-colors">
                                        <div className="flex justify-between text-sm font-bold mb-2">
                                            <span className={log.type === 'critical' ? 'text-red-600' : 'text-orange-600'}>{log.category}</span>
                                            <span className="text-slate-600">推播：{log.target}</span>
                                        </div>
                                        <p className="text-[16px] leading-relaxed mb-4 text-slate-900">{log.msg}</p>
                                        <div className="flex justify-between text-xs font-bold text-slate-500">
                                            <span>UID: {log.user}</span><span>{log.time}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-8 flex flex-col">
                            <h3 className="font-bold text-[16px] text-slate-900 mb-6 flex items-center gap-2"><Smartphone size={22} className="text-blue-600" /> NFC 實時報到</h3>
                            <div className="space-y-3 flex-1 overflow-y-auto custom-scrollbar pr-3">
                                {nfcCheckins.length === 0 ? <p className="text-slate-500 text-sm text-center py-10">尚無報到紀錄</p> : nfcCheckins.map((log, i) => (
                                    <div key={i} className="flex justify-between items-center p-4 bg-white border border-slate-200 rounded-lg hover:border-slate-400 transition-colors">
                                        <div><p className="text-[15px] font-bold text-slate-900">{log.name}</p><p className="text-xs text-slate-600 mt-1">{log.point}</p></div>
                                        <span className="text-sm font-medium text-slate-500">{log.time}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );

            // --- 解放版面：純粹的 LINE 滿版對話介面 ---
            const renderChatTakeover = () => (
                <div className="flex h-full w-full bg-white animate-in">
                    {/* 左側：對話名單 (無圓角、無外框滿版) */}
                    <div className="w-[340px] border-r border-slate-200 flex flex-col bg-white shrink-0">
                        <div className="p-4 border-b border-slate-200 bg-slate-50/50">
                            <div className="relative">
                                <Search className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500" size={18} />
                                <input type="text" placeholder="搜尋對話..." className="w-full bg-white border border-slate-200 rounded-lg py-2.5 pl-11 pr-4 text-[15px] focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none font-medium text-slate-900 placeholder:text-slate-400" />
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto custom-scrollbar">
                            {chatList.map(chat => (
                                <div key={chat.id} onClick={() => setChatTarget(chat)} className={`p-4 flex gap-4 cursor-pointer border-b border-slate-100 transition-colors ${chatTarget?.id === chat.id ? 'bg-[#f0f4f8]' : 'hover:bg-slate-50'}`}>
                                    <div className="relative">
                                        <div className="w-12 h-12 bg-slate-200 rounded-full flex-shrink-0 flex items-center justify-center font-bold text-slate-700 text-lg uppercase">{chat.name[0]}</div>
                                        {chat.status === 'online' && <div className="absolute bottom-0 right-0 w-3.5 h-3.5 bg-green-500 border-2 border-white rounded-full"></div>}
                                    </div>
                                    <div className="flex-1 min-w-0 flex flex-col justify-center">
                                        <div className="flex justify-between items-baseline mb-1">
                                            <span className="text-[16px] font-bold truncate text-slate-900">{chat.name}</span>
                                            <span className="text-xs text-slate-500">{chat.time}</span>
                                        </div>
                                        <p className="text-[14px] text-slate-600 truncate">{chat.lastMsg}</p>
                                    </div>
                                    {chat.unread > 0 && <div className="min-w-[20px] h-[20px] bg-[#ef4444] text-white text-[11px] font-bold flex items-center justify-center rounded-full self-center shadow-sm px-1.5">{chat.unread}</div>}
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* 右側：LINE 對話區 (滿版 #8bacce 背景) */}
                    <div className="flex-1 flex flex-col bg-[#8bacce]">
                        {chatTarget ? (
                            <>
                                {/* 頂部 Header */}
                                <div className="px-6 py-4 bg-white/95 backdrop-blur border-b border-slate-200/50 flex justify-between items-center z-10">
                                    <div className="flex items-center gap-3">
                                        <span className="text-[18px] font-bold text-slate-900">{chatTarget.name}</span>
                                        <span className="bg-[#06c755] text-white text-xs font-bold px-2.5 py-1 rounded tracking-wide">已接管對話</span>
                                    </div>
                                    <div className="flex items-center gap-2 text-slate-700 text-[13px] font-bold">
                                        <Bot size={18} className="text-[#06c755]"/> AI 輔助開啟
                                    </div>
                                </div>
                                
                                {/* 訊息滾動區 */}
                                <div className="flex-1 overflow-y-auto custom-scrollbar p-6 space-y-6">
                                    {messages.filter(m => m.userId === chatTarget.id).map(msg => (
                                        <div key={msg.id} className={`flex flex-col ${msg.sender === 'admin' ? 'items-end' : 'items-start'}`}>
                                            {msg.sender === 'user' && msg.aiCategory && (
                                                <div className="flex gap-1 mb-1.5 ml-2">
                                                    <span className="text-[11px] bg-white/80 text-slate-900 px-2 py-0.5 rounded-sm font-bold shadow-sm">{msg.aiCategory}</span>
                                                </div>
                                            )}
                                            <div className={`flex items-end gap-2 max-w-[80%] ${msg.sender === 'admin' ? 'flex-row' : 'flex-row-reverse'}`}>
                                                {/* 時間戳記 (LINE 規格放置在氣泡旁外側) */}
                                                <span className="text-[11px] text-white/90 font-medium mb-1 drop-shadow-sm">{msg.time}</span>
                                                
                                                {/* 對話氣泡 */}
                                                <div className={`px-4 py-2.5 text-[15px] shadow-sm leading-relaxed ${msg.sender === 'admin' ? 'line-bubble-admin' : 'line-bubble-user text-slate-900'}`}>
                                                    {msg.text}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                    <div ref={chatEndRef} />
                                </div>

                                {/* 底部：建議與輸入框 */}
                                <div className="bg-[#f5f5f5] border-t border-slate-200">
                                    {/* AI 建議列 */}
                                    {activeMessage?.aiSuggestions && (
                                        <div className="px-4 py-3 flex items-center gap-3 overflow-x-auto custom-scrollbar border-b border-slate-200 bg-white">
                                            <div className="flex items-center text-orange-600 shrink-0 px-1">
                                                <Zap size={16} className="fill-orange-500 mr-1.5"/>
                                                <span className="text-xs font-bold tracking-wide">AI 建議</span>
                                            </div>
                                            {activeMessage.aiSuggestions.map((s, idx) => (
                                                <button key={idx} onClick={() => setInputText(s)} className="shrink-0 bg-white border border-[#06c755] text-[#06c755] hover:bg-[#06c755] hover:text-white px-4 py-1.5 rounded-full text-[14px] font-bold transition-colors">
                                                    {s}
                                                </button>
                                            ))}
                                        </div>
                                    )}

                                    {/* 輸入區塊 */}
                                    <div className="px-4 py-3 flex items-end gap-3 bg-white">
                                        <button className="p-2 text-slate-500 hover:text-slate-800 transition-colors"><Plus size={26}/></button>
                                        <textarea value={inputText} onChange={(e) => setInputText(e.target.value)} placeholder="在此輸入訊息..." className="flex-1 bg-slate-100 rounded-lg border-none px-4 py-3 text-[15px] outline-none resize-none min-h-[44px] max-h-[120px] leading-relaxed text-slate-900 placeholder:text-slate-500" rows="1" onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } }} />
                                        <button onClick={handleSend} className="p-3 bg-[#06c755] text-white rounded-full hover:bg-[#05a64a] shadow-sm transition-all mb-0.5"><Send size={20} className="ml-0.5" /></button>
                                    </div>
                                </div>
                            </>
                        ) : (
                            <div className="flex-1 flex flex-col items-center justify-center text-white/90 animate-in">
                                <MessageSquare size={64} strokeWidth={1.5} className="mb-6 opacity-80" />
                                <p className="text-[16px] font-bold tracking-widest">請選擇左側列表開始接管對話</p>
                            </div>
                        )}
                    </div>
                </div>
            );

            const renderCRMView = () => (
                <div className="p-8 h-full overflow-y-auto bg-slate-50">
                    <div className="max-w-6xl mx-auto bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden animate-in">
                        <div className="p-8 border-b border-slate-200 flex justify-between items-center">
                            <h2 className="text-[18px] font-bold text-slate-900 flex items-center gap-3"><ShieldCheck size={24} className="text-blue-600" /> 權限矩陣與 TG 指派</h2>
                            <PermissionGate type="operate" role={user.role}>
                                <button className="bg-slate-900 text-white px-5 py-2.5 rounded-lg text-sm font-bold hover:bg-slate-800 transition-all">註冊新成員</button>
                            </PermissionGate>
                        </div>
                        <table className="w-full text-left text-[15px]">
                            <thead className="bg-slate-50 border-b border-slate-200 text-slate-600 font-bold text-sm">
                                <tr><th className="p-5 pl-8">姓名/部門</th><th className="p-5 text-center">操作權限</th><th className="p-5">TG 任務分組</th><th className="p-5 pr-8 text-right">設定</th></tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {staffMatrix.map(s => (
                                    <tr key={s.id} className="hover:bg-slate-50 transition-colors">
                                        <td className="p-5 pl-8"><p className="font-bold text-slate-900 text-[16px]">{s.name}</p><p className="text-sm text-slate-500 mt-1">{s.dept}</p></td>
                                        <td className="p-5 text-center">{s.canOperate ? <CheckCircle size={22} className="text-blue-600 mx-auto" /> : <div className="w-5 h-5 border-2 border-slate-300 rounded-full mx-auto"></div>}</td>
                                        <td className="p-5"><span className="bg-blue-50 text-blue-700 px-3 py-1 rounded border border-blue-200 font-bold text-sm">{s.tgTarget}</span></td>
                                        <td className="p-5 pr-8 text-right"><button className="text-slate-500 hover:text-blue-600 transition-colors"><Settings size={22}/></button></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );

            // --- 介面主骨架 ---
            return (
                <div className="h-screen w-screen flex bg-white text-slate-900 font-sans antialiased overflow-hidden">
                    {/* 左側主導航列 */}
                    <aside className="w-[260px] bg-slate-50 border-r border-slate-200 flex flex-col hidden lg:flex h-full shrink-0">
                        <div className="flex items-center gap-4 px-8 py-8 border-b border-slate-200">
                            <div className="w-10 h-10 bg-slate-900 rounded-xl flex items-center justify-center text-white"><LayoutDashboard size={20} /></div>
                            <div>
                                <h1 className="text-[20px] font-black tracking-tight text-slate-900">DS PRO</h1>
                                <p className="text-[11px] font-bold text-slate-500 uppercase tracking-widest mt-0.5">Matrix Hub</p>
                            </div>
                        </div>
                        
                        <nav className="flex-1 px-4 py-6 space-y-2">
                            <NavItem id="overview" icon={LayoutDashboard} label="營運數據看板" active={view === 'overview'} onClick={setView} />
                            <NavItem id="chat" icon={MessageSquare} label="LINE 接管對話" active={view === 'chat'} onClick={setView} />
                            <NavItem id="crm" icon={ShieldCheck} label="CRM 權限矩陣" active={view === 'crm'} onClick={setView} />
                            <div className="pt-8">
                                <p className="px-4 text-[12px] font-bold text-slate-500 mb-3">資料庫</p>
                                <NavItem id="cal" icon={Calendar} label="部門行事曆" active={view === 'cal'} onClick={setView} />
                            </div>
                        </nav>
                        
                        <div className="p-6 border-t border-slate-200 bg-white">
                            <div className={`flex items-center gap-2 text-[12px] font-bold mb-1 ${syncError ? 'text-red-600' : 'text-green-600'}`}>
                                <div className={`w-2 h-2 rounded-full ${syncError ? 'bg-red-500' : 'bg-green-500 animate-pulse'}`}></div>
                                {syncError ? 'Worker Disconnected' : 'System Online'}
                            </div>
                            <p className="text-[11px] text-slate-500 font-medium tracking-wide">AI Silent Monitoring</p>
                        </div>
                    </aside>

                    {/* 右側內容區 */}
                    <main className="flex-1 flex flex-col min-w-0 bg-white h-screen">
                        {/* 頂部通用 Header */}
                        <header className="h-[80px] px-8 border-b border-slate-200 bg-white flex justify-between items-center shrink-0">
                            <div className="relative w-[360px]">
                                <Search className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" size={18}/>
                                <input type="text" placeholder="搜尋..." className="w-full bg-slate-50 border border-slate-200 rounded-lg py-2.5 pl-11 pr-4 text-[15px] focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none font-medium text-slate-900 transition-all placeholder:text-slate-400" />
                            </div>
                            <div className="flex items-center gap-6">
                                <div className="relative cursor-pointer text-slate-500 hover:text-slate-800 transition-colors">
                                    <Bell size={22} />
                                    <div className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white"></div>
                                </div>
                                <div className="h-6 w-px bg-slate-300"></div>
                                <div className="flex items-center gap-3 cursor-pointer">
                                    <div className="w-9 h-9 rounded-full bg-slate-800 text-white flex items-center justify-center font-bold text-[15px]">{user.name[0]}</div>
                                    <div className="hidden md:block">
                                        <p className="text-[14px] font-bold text-slate-900">{user.name}</p>
                                        <p className="text-[11px] text-slate-500 font-medium">{user.dept}</p>
                                    </div>
                                </div>
                            </div>
                        </header>

                        {/* 動態渲染區域：如果是聊天室就滿版(p-0)，否則有 padding */}
                        <div className={`flex-1 overflow-hidden flex flex-col ${view === 'chat' ? 'p-0' : ''}`}>
                            {view === 'overview' && renderOverview()}
                            {view === 'chat' && renderChatTakeover()}
                            {view === 'crm' && renderCRMView()}
                            {view === 'cal' && (
                                <div className="p-8 h-full bg-slate-50 flex items-center justify-center">
                                    <div className="text-center animate-in">
                                        <Activity size={48} className="mx-auto text-slate-400 mb-4" />
                                        <p className="text-slate-600 font-bold text-[16px]">跨部資料同步中</p>
                                        <p className="text-slate-500 text-[14px] mt-2">Connecting to Data Hub...</p>
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        function NavItem({ id, icon: Icon, label, active, onClick }) {
            return (
                <button onClick={() => onClick(id)} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-colors font-sans ${active ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-200/50 hover:text-slate-900'}`}>
                    <Icon size={20} strokeWidth={active ? 2.5 : 2} /><span className="text-[15px] font-bold">{label}</span>
                </button>
            );
        }

        function StatCard({ title, value, change, icon: Icon, color }) {
            const colors = { blue: 'text-blue-600 bg-blue-50', red: 'text-red-600 bg-red-50', green: 'text-green-600 bg-green-50', purple: 'text-purple-600 bg-purple-50' };
            const texts = { blue: 'text-blue-600', green: 'text-green-600', red: 'text-red-600', purple: 'text-purple-600' };
            return (
                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between font-sans">
                    <div>
                        <p className="text-slate-500 text-[13px] font-bold mb-1">{title}</p>
                        <h3 className="text-[28px] font-black text-slate-900">{value}</h3>
                        <span className={`text-[12px] font-bold ${texts[color]}`}>{change}</span>
                    </div>
                    <div className={`p-4 rounded-full ${colors[color]}`}><Icon size={28} /></div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
