<body>
  <div class="app">
    <aside class="left"><header class="brand"><div class="oa">OA</div><div><h1>LINE OA 管理後台</h1><p>AI 建議模式，不自動回覆</p></div></header><section class="config"><label for="apiBase">Worker API URL</label><input id="apiBase" placeholder="https://mlm.fangwl591021.workers.dev" /><label for="apiToken">Dashboard Token</label><input id="apiToken" type="password" placeholder="輸入後同步聊天室" /><label for="knowledgeFile">知識庫 JSON</label><input id="knowledgeFile" type="file" accept=".json,application/json" /><button id="uploadKnowledge" type="button">上傳知識庫</button><div id="knowledgeStatus" class="knowledgeStatus">支援陣列格式，或含 version/items 的包裝格式。</div></section><div class="search"><input id="searchBox" placeholder="搜尋聊天、用戶名稱、用戶 ID、分類、標籤" /></div><div id="chatList" class="list"></div></aside>
    <main class="chat"><header class="head"><div class="room"><h2><span id="activeTitle">請選擇 LINE 對話</span><svg class="speaker" viewBox="0 0 24 24"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4Zm12.2 1.1a4 4 0 0 1 0 3.8l1.7 1a6 6 0 0 0 0-5.8l-1.7 1Zm3.4-2a8 8 0 0 1 0 7.8l1.7 1a10 10 0 0 0 0-9.8l-1.7 1Z"/></svg></h2><p id="activeSubtitle">AI 建議僅供管理員參考</p></div><div class="roomActions"><button class="statusBtn" id="pendingButton"><svg viewBox="0 0 24 24"><path d="M12 8v5"/><path d="M12 17h.01"/><path d="M10.3 3.9 2.8 17a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>待處理</button><button class="statusBtn" id="doneButton"><svg viewBox="0 0 24 24"><path d="m9 12 2 2 4-5"/><circle cx="12" cy="12" r="9"/></svg>處理完畢</button><button class="statusBtn" id="searchButton"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>搜尋</button><span class="pill" id="syncStatus">同步中</span><button class="refresh" id="refreshButton">↻</button></div></header><div id="manageBar" class="manage"></div><div id="manualBar" class="manualBar"><span>「手動聊天」功能執行中，可從本後台統一回覆與紀錄。</span><button id="manualEndButton">結束手動聊天</button></div><div id="errorBox"></div><section id="messages" class="messages"></section><footer class="composer"><div id="suggestions" class="suggestions"></div><div class="sendrow"><textarea id="replyText" placeholder="點選 AI 建議或手動輸入，Enter 傳送，Shift+Enter 換行"></textarea><div class="sendGroup"><button id="sendButton" class="sendPrimary">送出</button><button id="sendMenuButton" class="sendSplit">⌄</button><div id="sendMenu" class="sendMenu" hidden><button id="logButton" type="button">補記不推送</button></div></div></div><div class="composerTools"><div class="toolLeft"><button class="roundTool" id="helloTool" title="插入問候"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01"/><path d="M15 9h.01"/></svg></button><button class="roundTool" id="attachTool" title="附件"><svg viewBox="0 0 24 24"><path d="m21.4 11.6-8.5 8.5a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7L10 17.4a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg></button><button class="roundTool" id="plusTool" title="套用最新建議"><svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button><button class="roundTool" id="searchBottomButton" title="搜尋"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg></button></div><span>Enter：傳送 / Shift + Enter：換行</span></div></footer></main>
    <aside class="assist"><header class="assistHead"><div><h2>AI 助理</h2><p>僅提供管理員參考</p></div><span class="pill">建議中</span></header><div class="assistBody"><section class="card"><div class="cardTitle"><span>最新建議回覆</span><span class="time" id="suggestionCount">0</span></div><div class="cardBody"><div id="sideSuggestions" class="sideList"></div></div></section><section class="card"><div class="cardTitle"><span>對話標籤</span><span class="time" id="metaStatus">待回覆</span></div><div class="cardBody"><div id="tagGrid" class="tagGrid"></div><div class="tagAdd"><input id="customTag" class="tagInput" placeholder="新增自訂標籤" /><button id="addTag" class="outlineBtn">新增</button></div></div></section><section class="card"><div class="cardTitle">備註</div><div class="cardBody"><textarea id="noteInput" class="noteInput" placeholder="內部備註，不會發送給用戶"></textarea></div></section><section class="card"><div class="cardTitle"><span>重要訊息通報</span><span class="time" id="alertCount">0</span></div><div class="cardBody" id="alertList"></div></section></div></aside>
  </div>
  <script>
    const DEFAULT_API_BASE='https://mlm.fangwl591021.workers.dev';
    const TAG_OPTIONS=['產品問題','行政問題','訂單物流','退換貨','客訴','負評','建議','待追蹤','VIP'];
    const demoChats=[{'時間':Date.now()-420000,'身份':'user','用戶ID':'Udemo001','用戶名稱':'王小明','內容':'包裝破損如何更換？','類別':'退換貨作業','AI建議':JSON.stringify(['很抱歉造成您的困擾，請您先保留外盒與商品照片，我們會協助確認物流破損與換貨流程。','若是宅配破損，請提供收貨時間、照片與訂單資訊，我們會盡快協助後續處理。']),'重要':'是','情緒':'complaint','狀態':'待處理'},{'時間':Date.now()-180000,'身份':'user','用戶ID':'Udemo002','用戶名稱':'陳小姐','內容':'康美霜用法？','類別':'產品總覽','AI建議':JSON.stringify(['您好，康美霜屬於康立補系列產品。建議先依產品標示與個人膚況使用，如有敏感或不適請先停止並諮詢專業人員。']),'重要':'否','情緒':'neutral','狀態':'待回覆'}];
    const demoLogs=[{'時間':Date.now()-420000,'用戶ID':'Udemo001','用戶名稱':'王小明','內容':'包裝破損如何更換？','類別':'客訴 / 物流破損','情緒':'complaint','原因':'含破損與換貨需求，需人工關注。','狀態':'待處理','TG通知':'Demo'}];
    const demoMeta=[{'用戶ID':'Udemo001','用戶名稱':'王小明','處理狀態':'待處理','標籤':'客訴,退換貨','備註':'請優先確認照片與收貨日期','更新時間':Date.now()},{'用戶ID':'Udemo002','用戶名稱':'陳小姐','處理狀態':'待回覆','標籤':'產品問題','備註':'','更新時間':Date.now()}];
    const $=id=>document.getElementById(id);
    const els={apiBase:$('apiBase'),apiToken:$('apiToken'),knowledgeFile:$('knowledgeFile'),uploadKnowledge:$('uploadKnowledge'),knowledgeStatus:$('knowledgeStatus'),searchBox:$('searchBox'),chatList:$('chatList'),messages:$('messages'),suggestions:$('suggestions'),sideSuggestions:$('sideSuggestions'),suggestionCount:$('suggestionCount'),replyText:$('replyText'),sendButton:$('sendButton'),sendMenuButton:$('sendMenuButton'),sendMenu:$('sendMenu'),logButton:$('logButton'),refreshButton:$('refreshButton'),pendingButton:$('pendingButton'),doneButton:$('doneButton'),searchButton:$('searchButton'),searchBottomButton:$('searchBottomButton'),activeTitle:$('activeTitle'),activeSubtitle:$('activeSubtitle'),syncStatus:$('syncStatus'),alertList:$('alertList'),alertCount:$('alertCount'),errorBox:$('errorBox'),manageBar:$('manageBar'),manualBar:$('manualBar'),manualEndButton:$('manualEndButton'),tagGrid:$('tagGrid'),customTag:$('customTag'),addTag:$('addTag'),noteInput:$('noteInput'),metaStatus:$('metaStatus'),helloTool:$('helloTool'),attachTool:$('attachTool'),plusTool:$('plusTool')};
    const state={chats:demoChats,aiLogs:demoLogs,chatMeta:demoMeta,activeUserId:'',isDemo:true,noteTimer:null};
    els.apiBase.value=sanitizeApiBase(localStorage.getItem('line_ai_api_base')||DEFAULT_API_BASE);els.apiToken.value=localStorage.getItem('line_ai_api_token')||'';
    els.apiBase.addEventListener('change',saveSettings);els.apiToken.addEventListener('change',saveSettings);els.searchBox.addEventListener('input',render);els.refreshButton.addEventListener('click',sync);els.uploadKnowledge.addEventListener('click',uploadKnowledge);els.sendButton.addEventListener('click',()=>sendReply(false));els.logButton.addEventListener('click',()=>sendReply(true));els.sendMenuButton.addEventListener('click',()=>{els.sendMenu.hidden=!els.sendMenu.hidden});els.pendingButton.addEventListener('click',()=>markStatus('待處理'));els.doneButton.addEventListener('click',()=>markStatus('處理完畢'));els.searchButton.addEventListener('click',focusSearch);els.searchBottomButton.addEventListener('click',focusSearch);els.manualEndButton.addEventListener('click',()=>markStatus('處理完畢'));els.addTag.addEventListener('click',addCustomTag);els.customTag.addEventListener('keydown',e=>{if(e.key==='Enter')addCustomTag()});els.helloTool.addEventListener('click',()=>insertText('您好，'));els.attachTool.addEventListener('click',()=>showError('目前 LINE 推送僅支援文字；圖片與附件會放在下一版。'));els.plusTool.addEventListener('click',applyFirstSuggestion);els.noteInput.addEventListener('input',queueNoteSave);els.replyText.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendReply(false)}});document.addEventListener('click',e=>{if(!els.sendMenu.contains(e.target)&&e.target!==els.sendMenuButton)els.sendMenu.hidden=true});
    setInterval(sync,5000);render();sync();
    function saveSettings(){els.apiBase.value=sanitizeApiBase(els.apiBase.value);localStorage.setItem('line_ai_api_base',els.apiBase.value);localStorage.setItem('line_ai_api_token',els.apiToken.value.trim());sync()}
    async function sync(){const base=apiBase(),token=els.apiToken.value.trim();if(!base||!token){state.chats=demoChats;state.aiLogs=demoLogs;state.chatMeta=demoMeta;state.isDemo=true;setStatus('Demo 模式');clearError();render();return}try{setStatus('同步中');const res=await fetch(`${base}/api/data`,{headers:{Authorization:`Bearer ${token}`}});const json=await res.json();if(!res.ok||json.status!=='success')throw new Error(json.message||'同步失敗');state.chats=Array.isArray(json.data.chats)?json.data.chats:[];state.aiLogs=Array.isArray(json.data.aiLogs)?json.data.aiLogs:[];state.chatMeta=Array.isArray(json.data.chatMeta)?json.data.chatMeta:[];state.isDemo=false;setStatus('已同步');clearError();if(json.data.knowledgeMeta&&json.data.knowledgeMeta.count)els.knowledgeStatus.textContent=`目前知識庫 ${json.data.knowledgeMeta.count} 筆${json.data.knowledgeMeta.version?' · '+json.data.knowledgeMeta.version:''}`;render()}catch(err){setStatus('同步失敗',true);showError(err.message||String(err))}}
    async function uploadKnowledge(){const file=els.knowledgeFile.files&&els.knowledgeFile.files[0],token=els.apiToken.value.trim();if(!file){els.knowledgeStatus.textContent='請先選擇 JSON 檔。';return}if(!token){els.knowledgeStatus.textContent='請先輸入 Dashboard Token。';return}try{els.uploadKnowledge.disabled=true;const knowledge=JSON.parse(await file.text());const count=validateKnowledge(knowledge);els.knowledgeStatus.textContent=`準備上傳 ${count} 筆`;const res=await fetch(`${apiBase()}/api/knowledge`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({knowledge,fileName:file.name})});const json=await res.json();if(!res.ok||json.status!=='success')throw new Error(json.message||'知識庫上傳失敗');els.knowledgeStatus.textContent=`已匯入 ${json.count||count} 筆知識庫`;await sync()}catch(err){els.knowledgeStatus.textContent=err.message||String(err)}finally{els.uploadKnowledge.disabled=false}}
    function validateKnowledge(payload){const items=Array.isArray(payload)?payload:(payload&&Array.isArray(payload.items)?payload.items:[]);if(!items.length)throw new Error('JSON 必須是問答陣列，或包含 items 陣列。');items.forEach((item,index)=>{if(!item||!(item.question||item.q||item['問題'])||!(item.answer||item.a||item['答案']))throw new Error(`第 ${index+1} 筆缺少 question/answer`)});return items.length}
    async function sendReply(logOnly){const text=els.replyText.value.trim();if(!text||!state.activeUserId)return;const current=currentGroup();if(state.isDemo||!els.apiToken.value.trim()){state.chats.push({'時間':Date.now(),'身份':'admin','用戶ID':state.activeUserId,'用戶名稱':current?current.displayName:'','內容':text,'類別':logOnly?'客服補記':'Demo 回覆','AI建議':'','重要':'否','情緒':'neutral','狀態':'處理完畢'});updateLocalMeta({userId:state.activeUserId,userName:current?current.displayName:'',status:'處理完畢'});els.replyText.value='';render();return}try{els.sendButton.disabled=true;els.logButton.disabled=true;const endpoint=logOnly?'/api/log-reply':'/api/send';const res=await fetch(`${apiBase()}${endpoint}`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${els.apiToken.value.trim()}`},body:JSON.stringify({userId:state.activeUserId,text,userName:current?current.displayName:''})});const json=await res.json();if(!res.ok||json.status!=='success')throw new Error(json.message||'送出失敗');els.replyText.value='';els.sendMenu.hidden=true;await sync()}catch(err){showError(err.message||String(err))}finally{els.sendButton.disabled=false;els.logButton.disabled=false}}
    async function markStatus(status){const current=currentGroup();if(!current)return;await saveMeta({userId:current.userId,userName:current.displayName,status})}
    async function saveMeta(patch){if(!patch.userId)return;if(state.isDemo||!els.apiToken.value.trim()){updateLocalMeta(patch);render();return}try{const res=await fetch(`${apiBase()}/api/conversation-meta`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${els.apiToken.value.trim()}`},body:JSON.stringify(patch)});const json=await res.json();if(!res.ok||json.status!=='success')throw new Error(json.message||'儲存狀態失敗');await sync()}catch(err){showError(err.message||String(err))}}
    function updateLocalMeta(patch){const index=state.chatMeta.findIndex(row=>row['用戶ID']===patch.userId);const current=index>=0?state.chatMeta[index]:{'用戶ID':patch.userId,'用戶名稱':'','處理狀態':'待回覆','標籤':'','備註':'','更新時間':0};const next={...current,'用戶名稱':patch.userName||current['用戶名稱'],'處理狀態':patch.status||current['處理狀態'],'標籤':patch.tags?patch.tags.join(','):current['標籤'],'備註':patch.note!==undefined?patch.note:current['備註'],'更新時間':Date.now()};if(index>=0)state.chatMeta[index]=next;else state.chatMeta.push(next)}
    function toggleTag(tag){const group=currentGroup();if(!group)return;const tags=new Set(group.tags);tags.has(tag)?tags.delete(tag):tags.add(tag);saveMeta({userId:group.userId,userName:group.displayName,tags:Array.from(tags)})}
    function addCustomTag(){const tag=els.customTag.value.trim();if(!tag)return;els.customTag.value='';toggleTag(tag)}
    function queueNoteSave(){clearTimeout(state.noteTimer);const group=currentGroup();if(!group)return;const note=els.noteInput.value;state.noteTimer=setTimeout(()=>saveMeta({userId:group.userId,userName:group.displayName,note}),700)}
    function render(){const groups=groupRows(filteredRows());if(!state.activeUserId&&groups[0])state.activeUserId=groups[0].userId;renderList(groups);renderMessages(groups);renderAssistant(groups)}
    function filteredRows(){const q=els.searchBox.value.trim().toLowerCase();if(!q)return state.chats;return state.chats.filter(row=>{const meta=metaFor(row['用戶ID']);return [row['用戶名稱'],row['用戶ID'],row['內容'],row['類別'],row['狀態'],meta['處理狀態'],meta['標籤']].filter(Boolean).some(value=>String(value).toLowerCase().includes(q))})}
    function groupRows(rows){const map=new Map();rows.slice().sort((a,b)=>Number(a['時間']||0)-Number(b['時間']||0)).forEach(row=>{const id=row['用戶ID']||'unknown';if(!map.has(id))map.set(id,[]);map.get(id).push(row)});return Array.from(map.entries()).map(([userId,messages])=>{const last=messages[messages.length-1]||{},meta=metaFor(userId),displayName=meta['用戶名稱']||nameFromMessages(messages,userId),tags=parseTags(meta['標籤']);return{userId,displayName,messages,last,meta,status:meta['處理狀態']||last['狀態']||'待回覆',tags,note:meta['備註']||''}}).sort((a,b)=>Number(b.last['時間']||0)-Number(a.last['時間']||0))}
    function renderList(groups){els.chatList.innerHTML=groups.map(group=>{const last=group.last||{},hot=group.messages.some(row=>row['重要']==='是'),active=group.userId===state.activeUserId?' active':'',named=group.displayName&&group.displayName!==group.userId;return `<button class="item${active}" data-id="${esc(group.userId)}"><div class="avatar ${named?'named':''}">${esc(initialOf(group.displayName))}</div><div><div class="line"><span class="name">${esc(group.displayName)}</span><span class="time">${fmt(last['時間'])}</span></div><div class="uid">${esc(group.userId)}</div><div class="preview">${esc(last['內容']||'')}</div><div class="tags"><span class="${statusClass(group.status)}">${esc(group.status)}</span>${group.tags.slice(0,2).map(t=>`<span class="label">${esc(t)}</span>`).join('')}${hot?'<span class="label hot">重要</span>':''}</div></div></button>`}).join('')||'<div class="muted" style="padding:18px">沒有符合的聊天。</div>';document.querySelectorAll('.item').forEach(btn=>btn.onclick=()=>{state.activeUserId=btn.dataset.id;render()})}
    function renderMessages(groups){const group=groups.find(item=>item.userId===state.activeUserId)||groups[0];if(!group){els.activeTitle.textContent='尚無對話';els.activeSubtitle.textContent='等待 LINE webhook 收到訊息';els.manageBar.innerHTML='';els.messages.innerHTML='<div class="day">尚無訊息</div>';return}state.activeUserId=group.userId;els.activeTitle.textContent=group.displayName;els.activeSubtitle.textContent=`共 ${group.messages.length} 則訊息 · 用戶ID ${group.userId}`;els.pendingButton.classList.toggle('active',group.status==='待處理'||group.status==='待回覆');els.doneButton.classList.toggle('active',group.status==='處理完畢'||group.status==='已回覆');els.manualBar.classList.toggle('show',!isDoneStatus(group.status));els.manageBar.innerHTML=`<div class="manageLeft"><span class="${statusClass(group.status)}">${esc(group.status)}</span><div class="manageTags">${group.tags.map(t=>`<span class="label">${esc(t)}</span>`).join('')}</div></div><button class="outlineBtn" id="quickNoteButton">內部備註</button>`;setTimeout(()=>{const btn=$('quickNoteButton');if(btn)btn.onclick=()=>els.noteInput.focus()},0);els.messages.innerHTML='<div class="day">今天</div>'+group.messages.map(row=>{const isAdmin=row['身份']==='admin';const meta=[fmt(row['時間']),row['類別']||'',row['重要']==='是'?'重要':''].filter(Boolean).join(' · ');return `<div class="msg ${isAdmin?'admin':'user'}"><div class="wrap"><div class="bubble">${esc(row['內容']||'')}</div><div class="meta">${esc(meta)}</div></div></div>`}).join('');els.messages.scrollTop=els.messages.scrollHeight;const suggestions=suggestionsFor(group);els.suggestions.innerHTML=suggestions.length?suggestions.map(text=>`<button data-suggestion="${esc(text)}">${esc(text)}</button>`).join(''):'<span class="muted">目前沒有 AI 建議</span>';document.querySelectorAll('[data-suggestion]').forEach(btn=>btn.onclick=()=>{els.replyText.value=btn.dataset.suggestion;els.replyText.focus()})}
    function renderAssistant(groups){const group=groups.find(item=>item.userId===state.activeUserId)||groups[0];const suggestions=group?suggestionsFor(group):[];els.suggestionCount.textContent=String(suggestions.length);els.sideSuggestions.innerHTML=suggestions.length?suggestions.map(text=>`<button class="sideBtn" data-side-suggestion="${esc(text)}">${esc(text)}</button>`).join(''):'<div class="muted">選擇對話後，AI 建議會顯示在這裡。</div>';document.querySelectorAll('[data-side-suggestion]').forEach(btn=>btn.onclick=()=>{els.replyText.value=btn.dataset.sideSuggestion;els.replyText.focus()});els.metaStatus.textContent=group?group.status:'無';els.metaStatus.className=group?statusClass(group.status):'state neutral';els.tagGrid.innerHTML=TAG_OPTIONS.map(tag=>`<button class="tagChoice ${group&&group.tags.includes(tag)?'active':''}" data-tag="${esc(tag)}">${esc(tag)}</button>`).join('');document.querySelectorAll('[data-tag]').forEach(btn=>btn.onclick=()=>toggleTag(btn.dataset.tag));els.noteInput.value=group?group.note:'';els.alertCount.textContent=String(state.aiLogs.length);els.alertList.innerHTML=state.aiLogs.length?state.aiLogs.map(row=>`<article class="alert"><strong>${esc(nameOf(row,row['用戶ID']))} · ${esc(row['類別']||'重要訊息')}</strong><p>${esc(row['內容']||'')}</p><div class="time">${esc(row['狀態']||'待處理')} · ${fmt(row['時間'])} · TG ${esc(row['TG通知']||'')}</div></article>`).join(''):'<div class="muted">目前沒有客訴、負評、建議或重大風險通報。</div>'}
    function currentGroup(){return groupRows(state.chats).find(item=>item.userId===state.activeUserId)}
    function suggestionsFor(group){const row=[...group.messages].reverse().find(item=>item['身份']==='user');if(!row)return[];try{const value=typeof row['AI建議']==='string'?JSON.parse(row['AI建議']):row['AI建議'];return Array.isArray(value)?value.filter(Boolean):[]}catch(_err){return[]}}
    function metaFor(userId){return state.chatMeta.find(row=>row['用戶ID']===userId)||{}}
    function parseTags(value){return String(value||'').split(/[,，]/).map(v=>v.trim()).filter(Boolean)}
    function statusClass(status){const s=String(status||'').trim();if(s.includes('待處理'))return 'state danger';if(s.includes('待回覆'))return 'state warn';if(s.includes('處理完畢')||s.includes('已回覆'))return 'state dark';return 'state neutral'}
    function isDoneStatus(status){const s=String(status||'');return s.includes('處理完畢')||s.includes('已回覆')}
    function nameFromMessages(messages,fallback){for(let i=messages.length-1;i>=0;i-=1){const value=nameOf(messages[i],'');if(value&&value!==messages[i]['用戶ID'])return value}return String(fallback||'unknown')}
    function nameOf(row,fallback){const value=row&&(row['用戶名稱']||row.displayName||row.userName||row['姓名']);return String(value||fallback||'').trim()}
    function initialOf(name){return String(name||'U').trim().charAt(0).toUpperCase()||'U'}
    function insertText(text){const start=els.replyText.selectionStart||0,end=els.replyText.selectionEnd||0;els.replyText.value=els.replyText.value.slice(0,start)+text+els.replyText.value.slice(end);els.replyText.focus();els.replyText.selectionStart=els.replyText.selectionEnd=start+text.length}
    function applyFirstSuggestion(){const group=currentGroup(),suggestions=group?suggestionsFor(group):[];if(suggestions[0]){els.replyText.value=suggestions[0];els.replyText.focus()}}
    function focusSearch(){els.searchBox.focus();els.searchBox.select()}
    function apiBase(){const value=sanitizeApiBase(els.apiBase.value);if(value!==els.apiBase.value){els.apiBase.value=value;localStorage.setItem('line_ai_api_base',value)}return value}
    function sanitizeApiBase(value){const raw=String(value||'').trim().replace(/\/+$/,'');if(!raw||raw==='admin'||raw==='/admin')return DEFAULT_API_BASE;try{const url=new URL(raw,window.location.origin);const isStaticHost=url.hostname===window.location.hostname||url.hostname==='fangwl591021.github.io';if(isStaticHost||/\/admin$/i.test(url.pathname))return DEFAULT_API_BASE;return url.origin+url.pathname.replace(/\/+$/,'')}catch(_err){return DEFAULT_API_BASE}}
    function setStatus(text,bad){els.syncStatus.textContent=text;els.syncStatus.className=bad?'pill bad':'pill'}
    function showError(text){els.errorBox.innerHTML=text?`<p class="error">${esc(text)}</p>`:''}
    function clearError(){showError('')}
    function fmt(value){const n=Number(value);return n?new Date(n).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):''}
    function esc(value){return String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
  </script>
</body>
