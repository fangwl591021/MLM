<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LINE OA 管理後台</title>
  <style>
    :root{--line:#06c755;--line-dark:#00b14f;--ink:#111827;--sub:#667085;--border:#dfe5ec;--soft:#f6f8fb;--chat:#8fa9c4;--admin:#c9d7f4;--danger:#d92d20;--warn:#f79009;--dark:#111827}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;color:var(--ink);font-family:Inter,"Noto Sans TC",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}button,input,textarea{font:inherit}button{cursor:pointer}
    .app{display:grid;grid-template-columns:370px minmax(620px,1fr) 390px;height:100vh;background:#fff}.left{border-right:1px solid var(--border);min-height:0}.chat{display:grid;grid-template-rows:70px auto auto minmax(180px,1fr) 220px;height:100vh;min-height:0;overflow:hidden}.assist{border-left:1px solid var(--border);background:#fbfcfe;min-height:0}
    .brand,.head,.assistHead{height:70px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);background:#fff}.brand{justify-content:flex-start}.oa{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:var(--line);color:#fff;font-weight:900}.brand h1,.room h2,.assist h2{margin:0;font-size:17px;line-height:1.2;font-weight:900}.brand p,.room p,.assist p{margin:4px 0 0;color:var(--sub);font-size:12px}.room{min-width:0;flex:1}.room h2,.room p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .config{display:grid;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border);background:#f8fafc}.config label{color:#5d6675;font-size:12px;font-weight:800}.config input,.search input,textarea,.noteInput,.tagInput{width:100%;border:1px solid #d8dee8;background:#fff;outline:none}.config input{height:38px;border-radius:8px;padding:0 11px}.config input[type=file]{height:auto;padding:8px}.config button,.outlineBtn{height:36px;border:1px solid #b6ecc8;border-radius:8px;background:#effcf4;color:#067a35;font-weight:900}.secondaryBtn{border-color:#d8dee8!important;background:#fff!important;color:#344054!important}.knowledgeStatus{min-height:16px;color:#6b7280;font-size:12px;line-height:1.35}.search{padding:14px 16px;border-bottom:1px solid var(--border)}.search input{height:40px;border-radius:999px;padding:0 15px;background:#f4f7fa}.config input:focus,.search input:focus,textarea:focus,.noteInput:focus,.tagInput:focus{border-color:var(--line);box-shadow:0 0 0 3px rgba(6,199,85,.12)}
    .list{height:calc(100vh - 70px - 294px - 69px);overflow:auto}.item{width:100%;display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;padding:16px;border:0;border-bottom:1px solid #edf1f5;background:#fff;text-align:left}.item:hover,.item.active{background:#ebfbf3}.item.active{box-shadow:inset 4px 0 0 var(--line)}.avatar{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;background:#e4ebf3;color:#233044;font-weight:900;overflow:hidden}.avatar.named{background:#dff8e9;color:#057a36}.avatar img{width:100%;height:100%;display:block;border-radius:50%;object-fit:cover}.line{display:flex;justify-content:space-between;gap:8px;min-width:0}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:900}.time{color:var(--sub);font-size:11px;white-space:nowrap}.uid{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#7a8492;font-size:11px}.preview{margin-top:5px;overflow:hidden;color:#4b5563;font-size:13px;text-overflow:ellipsis;white-space:nowrap}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.label{border-radius:999px;padding:4px 9px;background:#eef2f7;color:#536072;font-size:11px;font-weight:850}.label.hot{background:#fff1f3;color:#c01048}.label.nameWait{background:#fff7ed;color:#9a3412}
    .state{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:7px 12px;color:#fff!important;font-size:13px;font-weight:950;line-height:1;letter-spacing:.03em;box-shadow:0 2px 8px rgba(17,24,39,.18)}.item .state{padding:6px 11px;font-size:12px}.state.danger{background:var(--danger)}.state.warn{background:var(--warn)}.state.dark{background:var(--dark)}.state.neutral{background:#475467}
    .roomActions{display:flex;align-items:center;gap:8px;flex:0 0 auto;min-width:max-content}.statusBtn{height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #778199;border-radius:2px;background:#fff;color:#4b5563;padding:0 14px;font-weight:850;white-space:nowrap}.statusBtn:hover,.statusBtn.active{border-color:#3d4a63;background:#f3f6fb}.pill{border:1px solid #b6ecc8;border-radius:999px;padding:6px 10px;background:#effcf4;color:#07833b;font-size:12px;font-weight:900;white-space:nowrap}.pill.bad{border-color:#fecdd3;background:#fff1f3;color:var(--danger)}.refresh{width:38px;height:38px;border:1px solid #d8dee8;border-radius:10px;background:#fff;color:#4b5563;flex:0 0 auto}
    .manage{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:8px 20px;border-bottom:1px solid var(--border);background:#f8fafc;overflow:hidden}.manageLeft{display:flex;align-items:center;gap:9px;min-width:0}.manageTags{display:flex;gap:6px;overflow:hidden}.manualBar{display:none;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px;background:#65718d;color:#fff}.manualBar.show{display:flex}.manualBar button{height:30px;border:1px solid rgba(255,255,255,.8);background:transparent;color:#fff;padding:0 12px}.error{margin:0;padding:9px 18px;border-bottom:1px solid #fecdd3;background:#fff1f3;color:var(--danger);font-size:12px;font-weight:800}
    .messages{min-height:0;overflow:auto;padding:24px 34px;background:linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.10) 1px,transparent 1px),var(--chat);background-size:36px 36px}.day{width:max-content;margin:0 auto 18px;border-radius:999px;padding:6px 13px;background:rgba(255,255,255,.58);color:#45505d;font-size:12px;font-weight:900}.msg{display:flex;margin:0 0 16px}.msg.admin{justify-content:flex-end}.wrap{max-width:min(680px,78%)}.bubble{padding:11px 14px;border-radius:6px 18px 18px 18px;background:#fff;color:#111827;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 1px rgba(20,30,45,.08)}.admin .bubble{border-radius:18px 6px 18px 18px;background:var(--admin)}.meta{margin-top:5px;color:rgba(31,35,41,.68);font-size:11px;font-weight:700}.admin .meta{text-align:right}.empty{display:grid;place-items:center;height:100%;padding:24px;text-align:center;color:#475467}.empty strong{display:block;margin-bottom:6px;color:#111827;font-size:17px}
    .composer{border-top:1px solid var(--border);background:#fff}.suggestions{display:flex;gap:8px;min-height:50px;padding:10px 16px;overflow-x:auto;border-bottom:1px solid #edf1f5;background:#f8fcf9}.suggestions button{flex:0 0 auto;max-width:520px;border:1px solid #91deb0;border-radius:999px;padding:8px 13px;background:#fff;color:#067a35;font-size:13px;font-weight:850;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sendrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:12px 16px 6px;align-items:end}textarea{min-height:52px;max-height:140px;resize:vertical;border-radius:12px;padding:12px;background:#fbfcfd;line-height:1.45}.sendGroup{position:relative;display:flex;align-items:stretch}.sendPrimary{height:48px;border:0;border-radius:4px 0 0 4px;background:var(--line);color:#fff;padding:0 17px;font-weight:900}.sendSplit{width:34px;height:48px;border:0;border-left:1px solid rgba(255,255,255,.5);border-radius:0 4px 4px 0;background:var(--line-dark);color:#fff;font-weight:900}.sendMenu{position:absolute;right:0;bottom:54px;width:150px;border:1px solid var(--border);border-radius:8px;background:#fff;box-shadow:0 12px 30px rgba(15,23,42,.16);overflow:hidden;z-index:5}.sendMenu[hidden]{display:none}.sendMenu button{width:100%;height:38px;border:0;background:#fff;color:#273142;text-align:left;padding:0 12px}.composerTools{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 16px 10px;color:#7b8798}.toolLeft{display:flex;gap:10px}.roundTool{width:34px;height:34px;border:0;background:#fff;color:#52627a;font-size:20px}
    .assistBody{height:calc(100vh - 70px);overflow:auto;padding:16px}.card{margin-bottom:13px;border:1px solid var(--border);border-radius:12px;background:#fff;overflow:hidden}.cardTitle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border-bottom:1px solid #edf1f5;font-size:14px;font-weight:900}.cardBody{padding:13px 14px}.sideList{display:grid;gap:9px}.sideBtn{border:1px solid #d9f2e2;border-radius:10px;padding:11px;background:#fbfffc;color:#26303d;line-height:1.48;text-align:left}.profileGrid{display:grid;gap:9px}.profileGrid input{width:100%;height:36px;border:1px solid #d8dee8;border-radius:8px;padding:0 10px;outline:none}.profileActions{display:grid;grid-template-columns:minmax(0,1fr) 86px;gap:8px;margin-top:10px}.tagGrid{display:flex;flex-wrap:wrap;gap:8px}.tagChoice{height:32px;border:1px solid #d8dee8;border-radius:999px;background:#fff;color:#536072;padding:0 11px;font-weight:800}.tagChoice.active{border-color:#75d997;background:#effcf4;color:#057a36}.tagAdd{display:grid;grid-template-columns:minmax(0,1fr) 62px;gap:8px;margin-top:10px}.tagInput,.noteInput{height:36px;border-radius:8px;padding:0 10px}.noteInput{height:64px;padding:8px 10px;resize:vertical}.alert{margin-bottom:10px;border:1px solid #ffd9b2;border-left:4px solid #f79009;border-radius:10px;padding:11px;background:#fff7ed}.alert strong{display:block;margin-bottom:6px;color:#9a3412;font-size:13px}.alert p{margin:0 0 8px;color:#374151;line-height:1.45}.muted{color:var(--sub);font-size:12px;line-height:1.55}
    .chat{grid-template-rows:70px auto auto auto minmax(180px,1fr) 220px}.composer{display:grid;grid-template-rows:56px minmax(100px,1fr) 42px;height:220px;min-height:0;overflow:hidden}.suggestions{height:56px;min-height:0;overflow-x:auto;overflow-y:hidden}.sendrow{align-items:stretch;min-height:0;padding:12px 16px 8px}textarea{height:100%;min-height:96px;max-height:none;resize:none;line-height:1.55;padding:13px 14px}.sendPrimary{height:auto;min-width:72px}.sendSplit{height:auto;width:36px}.sendMenu{bottom:calc(100% + 8px)}
    @media(max-width:1100px){body{overflow:auto}.app{grid-template-columns:350px minmax(620px,1fr);width:max-content}.assist{display:none}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="left">
      <header class="brand"><div class="oa">OA</div><div><h1>LINE OA 管理後台</h1><p>AI 建議模式，不自動回覆</p></div></header>
      <section class="config">
        <label for="apiBase">Worker API URL</label><input id="apiBase" placeholder="https://mlm.fangwl591021.workers.dev" />
        <label for="apiToken">Dashboard Token</label><input id="apiToken" type="password" placeholder="輸入後同步聊天室" />
        <label for="knowledgeFile">知識庫 JSON</label><input id="knowledgeFile" type="file" accept=".json,application/json" />
        <button id="uploadKnowledge" type="button">上傳知識庫</button>
        <button id="backfillProfiles" type="button" class="secondaryBtn">補抓名稱頭像</button>
        <div id="knowledgeStatus" class="knowledgeStatus">尚未同步知識庫狀態。</div>
      </section>
      <div class="search"><input id="searchBox" placeholder="搜尋聊天、用戶名稱、用戶 ID、分類、標籤" /></div>
      <div id="chatList" class="list"></div>
    </aside>

    <main class="chat">
      <header class="head">
        <div class="room"><h2 id="activeTitle">正在同步 LINE 對話</h2><p id="activeSubtitle">不顯示模擬資料，只讀取正式 LINE OA 訊息</p></div>
        <div class="roomActions">
          <button class="statusBtn" id="pendingButton">待處理</button>
          <button class="statusBtn" id="doneButton">處理完畢</button>
          <button class="statusBtn" id="searchButton">搜尋</button>
          <span class="pill" id="syncStatus">同步中</span>
          <button class="refresh" id="refreshButton">↻</button>
        </div>
      </header>
      <div id="manageBar" class="manage"></div>
      <div id="manualBar" class="manualBar"><span>「手動聊天」功能執行中，可從本後台統一回覆與紀錄。</span><button id="manualEndButton">結束手動聊天</button></div>
      <div id="errorBox"></div>
      <section id="messages" class="messages"></section>
      <footer class="composer">
        <div id="suggestions" class="suggestions"></div>
        <div class="sendrow">
          <textarea id="replyText" placeholder="點選 AI 建議或手動輸入，Enter 傳送，Shift+Enter 換行"></textarea>
          <div class="sendGroup"><button id="sendButton" class="sendPrimary">送出</button><button id="sendMenuButton" class="sendSplit">⌄</button><div id="sendMenu" class="sendMenu" hidden><button id="logButton" type="button">補記不推送</button></div></div>
        </div>
        <div class="composerTools"><div class="toolLeft"><button class="roundTool" id="helloTool" title="插入問候">☺</button><button class="roundTool" id="attachTool" title="附件">⌘</button><button class="roundTool" id="plusTool" title="套用最新建議">＋</button><button class="roundTool" id="searchBottomButton" title="搜尋">⌕</button></div><span>Enter：傳送 / Shift + Enter：換行</span></div>
      </footer>
    </main>

    <aside class="assist">
      <header class="assistHead"><div><h2>AI 助理</h2><p>僅提供管理員參考</p></div><span class="pill">建議中</span></header>
      <div class="assistBody">
        <section class="card"><div class="cardTitle"><span>最新建議回覆</span><span class="time" id="suggestionCount">0</span></div><div class="cardBody"><div id="sideSuggestions" class="sideList"></div></div></section>
        <section class="card"><div class="cardTitle"><span>用戶資料</span><span class="time" id="profileState">未同步</span></div><div class="cardBody"><div class="profileGrid"><input id="profileName" placeholder="顯示名稱，例如：王小姐" /><input id="profileAvatar" placeholder="頭像 URL，可留空" /></div><div class="profileActions"><span id="profileHint" class="muted">自動補抓失敗時，可手動固定顯示名稱。</span><button id="saveProfile" class="outlineBtn">儲存</button></div></div></section>
        <section class="card"><div class="cardTitle"><span>對話標籤</span><span class="time" id="metaStatus">無</span></div><div class="cardBody"><div id="tagGrid" class="tagGrid"></div><div class="tagAdd"><input id="customTag" class="tagInput" placeholder="新增自訂標籤" /><button id="addTag" class="outlineBtn">新增</button></div></div></section>
        <section class="card"><div class="cardTitle">備註</div><div class="cardBody"><textarea id="noteInput" class="noteInput" placeholder="內部備註，不會發送給用戶"></textarea></div></section>
        <section class="card"><div class="cardTitle"><span>重要訊息通報</span><span class="time" id="alertCount">0</span></div><div class="cardBody" id="alertList"></div></section>
      </div>
    </aside>
  </div>

  <script>
    const DEFAULT_API_BASE = "https://mlm.fangwl591021.workers.dev";
    const TAG_OPTIONS = ["產品問題", "行政問題", "訂單物流", "退換貨", "客訴", "負評", "建議", "待追蹤", "VIP"];
    const $ = (id) => document.getElementById(id);
    const els = {
      apiBase: $("apiBase"), apiToken: $("apiToken"), knowledgeFile: $("knowledgeFile"), uploadKnowledge: $("uploadKnowledge"), backfillProfiles: $("backfillProfiles"), knowledgeStatus: $("knowledgeStatus"),
      searchBox: $("searchBox"), chatList: $("chatList"), messages: $("messages"), suggestions: $("suggestions"), sideSuggestions: $("sideSuggestions"), suggestionCount: $("suggestionCount"),
      replyText: $("replyText"), sendButton: $("sendButton"), sendMenuButton: $("sendMenuButton"), sendMenu: $("sendMenu"), logButton: $("logButton"), refreshButton: $("refreshButton"),
      pendingButton: $("pendingButton"), doneButton: $("doneButton"), searchButton: $("searchButton"), searchBottomButton: $("searchBottomButton"), activeTitle: $("activeTitle"), activeSubtitle: $("activeSubtitle"),
      syncStatus: $("syncStatus"), alertList: $("alertList"), alertCount: $("alertCount"), errorBox: $("errorBox"), manageBar: $("manageBar"), manualBar: $("manualBar"), manualEndButton: $("manualEndButton"),
      tagGrid: $("tagGrid"), customTag: $("customTag"), addTag: $("addTag"), noteInput: $("noteInput"), metaStatus: $("metaStatus"), profileName: $("profileName"), profileAvatar: $("profileAvatar"), saveProfile: $("saveProfile"), profileState: $("profileState"), profileHint: $("profileHint"), helloTool: $("helloTool"), attachTool: $("attachTool"), plusTool: $("plusTool")
    };
    const state = { chats: [], threads: [], aiLogs: [], chatMeta: [], activeUserId: "", loaded: false, noteTimer: null };

    els.apiBase.value = sanitizeApiBase(localStorage.getItem("line_ai_api_base") || DEFAULT_API_BASE);
    els.apiToken.value = localStorage.getItem("line_ai_api_token") || "";
    els.apiBase.addEventListener("change", saveSettings);
    els.apiToken.addEventListener("change", saveSettings);
    els.searchBox.addEventListener("input", render);
    els.refreshButton.addEventListener("click", sync);
    els.uploadKnowledge.addEventListener("click", uploadKnowledge);
    els.backfillProfiles.addEventListener("click", backfillProfiles);
    els.sendButton.addEventListener("click", () => sendReply(false));
    els.logButton.addEventListener("click", () => sendReply(true));
    els.sendMenuButton.addEventListener("click", () => { els.sendMenu.hidden = !els.sendMenu.hidden; });
    els.pendingButton.addEventListener("click", () => markStatus("待處理"));
    els.doneButton.addEventListener("click", () => markStatus("處理完畢"));
    els.searchButton.addEventListener("click", focusSearch);
    els.searchBottomButton.addEventListener("click", focusSearch);
    els.manualEndButton.addEventListener("click", () => markStatus("處理完畢"));
    els.saveProfile.addEventListener("click", saveProfile);
    els.addTag.addEventListener("click", addCustomTag);
    els.customTag.addEventListener("keydown", (e) => { if (e.key === "Enter") addCustomTag(); });
    els.helloTool.addEventListener("click", () => insertText("您好，"));
    els.attachTool.addEventListener("click", () => showError("目前 LINE 推送僅支援文字；圖片與附件會放在下一版。"));
    els.plusTool.addEventListener("click", applyFirstSuggestion);
    els.noteInput.addEventListener("input", queueNoteSave);
    els.replyText.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendReply(false); } });
    document.addEventListener("click", (e) => { if (!els.sendMenu.contains(e.target) && e.target !== els.sendMenuButton) els.sendMenu.hidden = true; });

    render();
    sync();
    setInterval(sync, 5000);

    function saveSettings() {
      els.apiBase.value = sanitizeApiBase(els.apiBase.value);
      localStorage.setItem("line_ai_api_base", els.apiBase.value);
      localStorage.setItem("line_ai_api_token", els.apiToken.value.trim());
      sync();
    }

    async function sync() {
      const base = apiBase();
      const token = els.apiToken.value.trim();
      if (!base || !token) {
        state.loaded = true; state.chats = []; state.threads = []; state.aiLogs = []; state.chatMeta = [];
        setStatus("未連線", true); clearError(); render(); return;
      }
      try {
        setStatus("同步中");
        const res = await fetch(`${base}/api/data`, { headers: { Authorization: `Bearer ${token}` } });
        const json = await res.json();
        if (!res.ok || json.status !== "success") throw new Error(json.message || "同步失敗");
        state.chats = Array.isArray(json.data.chats) ? json.data.chats : [];
        state.threads = Array.isArray(json.data.threads) ? json.data.threads : [];
        state.aiLogs = Array.isArray(json.data.aiLogs) ? json.data.aiLogs : [];
        state.chatMeta = Array.isArray(json.data.chatMeta) ? json.data.chatMeta : [];
        state.loaded = true;
        const activeExists = state.threads.some((thread) => thread.userId === state.activeUserId) || state.chats.some((row) => row["用戶ID"] === state.activeUserId);
        if (!activeExists) state.activeUserId = state.threads[0] ? state.threads[0].userId : (state.chats[0] ? state.chats[0]["用戶ID"] : "");
        if (json.data.knowledgeMeta && json.data.knowledgeMeta.count) els.knowledgeStatus.textContent = `目前知識庫 ${json.data.knowledgeMeta.count} 筆${json.data.knowledgeMeta.version ? " · " + json.data.knowledgeMeta.version : ""}`;
        setStatus("已同步"); clearError(); render();
      } catch (err) {
        state.loaded = true; setStatus("同步失敗", true); showError(err.message || String(err)); render();
      }
    }

    async function uploadKnowledge() {
      const file = els.knowledgeFile.files && els.knowledgeFile.files[0];
      if (!file) { els.knowledgeStatus.textContent = "請先選擇 JSON 檔。"; return; }
      try {
        els.uploadKnowledge.disabled = true;
        const knowledge = JSON.parse(await file.text());
        const count = validateKnowledge(knowledge);
        els.knowledgeStatus.textContent = `準備上傳 ${count} 筆`;
        const res = await fetch(`${apiBase()}/api/knowledge`, { method: "POST", headers: authJsonHeaders(), body: JSON.stringify({ knowledge, fileName: file.name }) });
        const json = await res.json();
        if (!res.ok || json.status !== "success") throw new Error(json.message || "知識庫上傳失敗");
        els.knowledgeStatus.textContent = `已匯入 ${json.count || count} 筆知識庫`;
        await sync();
      } catch (err) {
        els.knowledgeStatus.textContent = err.message || String(err);
      } finally {
        els.uploadKnowledge.disabled = false;
      }
    }

    async function backfillProfiles() {
      try {
        els.backfillProfiles.disabled = true;
        els.knowledgeStatus.textContent = "正在補抓 LINE 名稱與頭像...";
        const res = await fetch(`${apiBase()}/api/backfill-profiles`, { method: "POST", headers: authJsonHeaders(), body: JSON.stringify({ limit: 100 }) });
        const json = await res.json();
        if (!res.ok || json.status !== "success") throw new Error(json.message || "補抓失敗");
        const updated = (json.results || []).filter((item) => item.updated).length;
        const failed = (json.results || []).filter((item) => !item.updated);
        if (updated === 0 && failed.length) {
          const sample = failed.slice(0, 3).map((item) => `${item.userId}: LINE ${item.profileStatus || "?"}`).join("，");
          els.knowledgeStatus.textContent = `已檢查 ${json.scanned || 0} 筆，但未更新。${sample}`;
        } else {
          els.knowledgeStatus.textContent = `已檢查 ${json.scanned || 0} 筆，更新 ${updated} 筆名稱/頭像`;
        }
        if (state.activeUserId && updated === 0) await debugActiveProfile();
        await sync();
      } catch (err) {
        els.knowledgeStatus.textContent = err.message || String(err);
      } finally {
        els.backfillProfiles.disabled = false;
      }
    }

    async function debugActiveProfile() {
      try {
        const res = await fetch(`${apiBase()}/api/profile-debug?userId=${encodeURIComponent(state.activeUserId)}`, { headers: { Authorization: `Bearer ${els.apiToken.value.trim()}` } });
        const json = await res.json();
        if (!res.ok || json.status !== "success") return;
        const direct = json.profileChecks && json.profileChecks.direct ? json.profileChecks.direct : {};
        const name = direct.data && direct.data.displayName ? direct.data.displayName : "";
        const hint = direct.ok
          ? `LINE Profile 回 ${direct.status}，名稱：${name || "空白"}，請再按同步或補抓。`
          : `LINE Profile 回 ${direct.status || "失敗"}，此用戶暫時無法由 Profile API 取得名稱/頭像。`;
        els.knowledgeStatus.textContent = `${els.knowledgeStatus.textContent}。目前用戶：${hint}`;
      } catch (_err) {
        // Keep the backfill result visible; profile debug is only an extra hint.
      }
    }

    function validateKnowledge(payload) {
      const items = Array.isArray(payload) ? payload : (payload && Array.isArray(payload.items) ? payload.items : []);
      if (!items.length) throw new Error("JSON 必須是問答陣列，或包含 items 陣列。");
      items.forEach((item, index) => {
        if (!item || !(item.question || item.q || item["問題"]) || !(item.answer || item.a || item["答案"])) throw new Error(`第 ${index + 1} 筆缺少 question/answer`);
      });
      return items.length;
    }

    async function sendReply(logOnly) {
      const text = els.replyText.value.trim();
      if (!text || !state.activeUserId) return;
      const current = currentGroup();
      try {
        els.sendButton.disabled = true; els.logButton.disabled = true;
        const endpoint = logOnly ? "/api/log-reply" : "/api/send";
        const res = await fetch(`${apiBase()}${endpoint}`, { method: "POST", headers: authJsonHeaders(), body: JSON.stringify({ userId: state.activeUserId, text, userName: realName(current) }) });
        const json = await res.json();
        if (!res.ok || json.status !== "success") throw new Error(json.message || "送出失敗");
        els.replyText.value = ""; els.sendMenu.hidden = true; await sync();
      } catch (err) {
        showError(err.message || String(err));
      } finally {
        els.sendButton.disabled = false; els.logButton.disabled = false;
      }
    }

    async function markStatus(status) {
      const current = currentGroup();
      if (!current) return;
      await saveMeta({ userId: current.userId, userName: realName(current), pictureUrl: current.avatarUrl || "", status });
    }
    async function saveMeta(patch) {
      if (!patch.userId) return;
      try {
        const res = await fetch(`${apiBase()}/api/conversation-meta`, { method: "POST", headers: authJsonHeaders(), body: JSON.stringify(patch) });
        const json = await res.json();
        if (!res.ok || json.status !== "success") throw new Error(json.message || "儲存狀態失敗");
        await sync();
      } catch (err) {
        showError(err.message || String(err));
      }
    }
    function toggleTag(tag) {
      const group = currentGroup();
      if (!group) return;
      const tags = new Set(group.tags);
      tags.has(tag) ? tags.delete(tag) : tags.add(tag);
      saveMeta({ userId: group.userId, userName: realName(group), pictureUrl: group.avatarUrl || "", tags: Array.from(tags) });
    }
    function addCustomTag() { const tag = els.customTag.value.trim(); if (!tag) return; els.customTag.value = ""; toggleTag(tag); }
    async function saveProfile() {
      const group = currentGroup();
      if (!group) return;
      await saveMeta({ userId: group.userId, userName: els.profileName.value.trim(), pictureUrl: els.profileAvatar.value.trim() });
      els.profileHint.textContent = "已儲存顯示資料。";
    }
    function queueNoteSave() {
      clearTimeout(state.noteTimer);
      const group = currentGroup();
      if (!group) return;
      const note = els.noteInput.value;
      state.noteTimer = setTimeout(() => saveMeta({ userId: group.userId, userName: realName(group), pictureUrl: group.avatarUrl || "", note }), 700);
    }

    function render() {
      const groups = state.threads.length ? filteredThreads().map(threadToGroup) : groupRows(filteredRows());
      if (!state.activeUserId && groups[0]) state.activeUserId = groups[0].userId;
      renderList(groups); renderMessages(groups); renderAssistant(groups);
    }
    function filteredThreads() {
      const q = els.searchBox.value.trim().toLowerCase();
      if (!q) return state.threads;
      return state.threads.filter((thread) => {
        return [thread.name, thread.displayName, thread.userId, thread.summary, thread.status, thread.tags && thread.tags.join(" ")].filter(Boolean).some((value) => String(value).toLowerCase().includes(q));
      });
    }
    function threadToGroup(thread) {
      const messages = (thread.messages || []).map((msg) => msg.raw || {
        "時間": msg.createdAt,
        "身份": msg.senderRole === "admin" ? "admin" : "user",
        "用戶ID": thread.userId,
        "內容": msg.text,
        "類別": msg.category,
        "AI建議": JSON.stringify(msg.suggestions || []),
        "重要": msg.important ? "是" : "否",
        "狀態": thread.status,
        "用戶名稱": thread.name || thread.displayName || "",
        "頭像URL": thread.pictureUrl || "",
      });
      const last = messages[messages.length - 1] || {};
      const displayName = String(thread.name || thread.displayName || thread.userId || "LINE 用戶").trim();
      const tags = Array.isArray(thread.tags) ? thread.tags : parseTags(thread.tags);
      return {
        userId: thread.userId,
        displayName,
        avatarUrl: String(thread.pictureUrl || "").trim(),
        messages,
        last,
        meta: {
          "用戶ID": thread.userId,
          "用戶名稱": displayName,
          "處理狀態": thread.status || "待回覆",
          "標籤": tags.join(","),
          "備註": thread.note || "",
          "頭像URL": thread.pictureUrl || "",
        },
        status: thread.status || "待回覆",
        tags,
        note: thread.note || "",
        hasRealName: thread.hasRealName !== false && !looksLikeUserId(displayName, thread.userId),
      };
    }
    function filteredRows() {
      const q = els.searchBox.value.trim().toLowerCase();
      if (!q) return state.chats;
      return state.chats.filter((row) => {
        const meta = metaFor(row["用戶ID"]);
        return [row["用戶名稱"], row["用戶ID"], row["內容"], row["類別"], row["狀態"], meta["處理狀態"], meta["標籤"]].filter(Boolean).some((value) => String(value).toLowerCase().includes(q));
      });
    }
    function groupRows(rows) {
      const map = new Map();
      rows.slice().sort((a, b) => Number(a["時間"] || 0) - Number(b["時間"] || 0)).forEach((row) => {
        const id = row["用戶ID"] || "unknown";
        if (!map.has(id)) map.set(id, []);
        map.get(id).push(row);
      });
      return Array.from(map.entries()).map(([userId, messages]) => {
        const last = messages[messages.length - 1] || {};
        const meta = metaFor(userId);
        const displayName = bestDisplayName(meta, messages, userId);
        const avatarUrl = String(meta["頭像URL"] || last["頭像URL"] || "").trim();
        const tags = parseTags(meta["標籤"]);
        return { userId, displayName, avatarUrl, messages, last, meta, status: meta["處理狀態"] || last["狀態"] || "待回覆", tags, note: meta["備註"] || "", hasRealName: !looksLikeUserId(displayName, userId) };
      }).sort((a, b) => Number(b.last["時間"] || 0) - Number(a.last["時間"] || 0));
    }
    function renderList(groups) {
      if (!groups.length) {
        els.chatList.innerHTML = `<div class="empty"><div><strong>${state.loaded ? "尚無正式對話" : "正在同步"}</strong><div>${state.loaded ? "等待 LINE webhook 收到用戶訊息。" : "正在連線讀取正式資料。"}</div></div></div>`;
        return;
      }
      els.chatList.innerHTML = groups.map((group) => {
        const last = group.last || {};
        const hot = group.messages.some((row) => row["重要"] === "是");
        const active = group.userId === state.activeUserId ? " active" : "";
        const avatar = group.avatarUrl ? `<img src="${esc(group.avatarUrl)}" alt="">` : esc(initialOf(group.displayName));
        return `<button class="item${active}" data-id="${esc(group.userId)}"><div class="avatar ${group.hasRealName ? "named" : ""}">${avatar}</div><div><div class="line"><span class="name">${esc(group.displayName)}</span><span class="time">${fmt(last["時間"])}</span></div><div class="uid">${esc(group.userId)}</div><div class="preview">${esc(last["內容"] || "")}</div><div class="tags"><span class="${statusClass(group.status)}">${esc(group.status)}</span>${!group.hasRealName ? '<span class="label nameWait">名稱待同步</span>' : ""}${group.tags.slice(0, 2).map((t) => `<span class="label">${esc(t)}</span>`).join("")}${hot ? '<span class="label hot">重要</span>' : ""}</div></div></button>`;
      }).join("");
      document.querySelectorAll(".item").forEach((btn) => { btn.onclick = () => { state.activeUserId = btn.dataset.id; render(); }; });
    }
    function renderMessages(groups) {
      const group = groups.find((item) => item.userId === state.activeUserId) || groups[0];
      if (!group) {
        els.activeTitle.textContent = state.loaded ? "尚無正式對話" : "正在同步 LINE 對話";
        els.activeSubtitle.textContent = state.loaded ? "沒有任何模擬資料，等待正式訊息進入。" : "不顯示模擬資料，只讀取正式 LINE OA 訊息";
        els.manageBar.innerHTML = ""; els.manualBar.classList.remove("show");
        els.messages.innerHTML = `<div class="empty"><div><strong>${state.loaded ? "尚無訊息" : "同步中"}</strong><div>${state.loaded ? "請等待 LINE webhook 收到用戶訊息。" : "正在讀取 Google Sheet 與 AI 建議資料。"}</div></div></div>`;
        els.suggestions.innerHTML = '<span class="muted">目前沒有 AI 建議</span>';
        return;
      }
      state.activeUserId = group.userId;
      els.activeTitle.textContent = group.displayName;
      els.activeSubtitle.textContent = `共 ${group.messages.length} 則訊息 · 用戶ID ${group.userId}`;
      els.pendingButton.classList.toggle("active", group.status === "待處理" || group.status === "待回覆");
      els.doneButton.classList.toggle("active", group.status === "處理完畢" || group.status === "已回覆");
      els.manualBar.classList.toggle("show", !isDoneStatus(group.status));
      els.manageBar.innerHTML = `<div class="manageLeft"><span class="${statusClass(group.status)}">${esc(group.status)}</span><div class="manageTags">${!group.hasRealName ? '<span class="label nameWait">用戶名稱待同步</span>' : ""}${group.tags.map((t) => `<span class="label">${esc(t)}</span>`).join("")}</div></div><button class="outlineBtn" id="quickNoteButton">內部備註</button>`;
      setTimeout(() => { const btn = $("quickNoteButton"); if (btn) btn.onclick = () => els.noteInput.focus(); }, 0);
      els.messages.innerHTML = '<div class="day">今天</div>' + group.messages.map((row) => {
        const isAdmin = row["身份"] === "admin";
        const meta = [fmt(row["時間"]), row["類別"] || "", row["重要"] === "是" ? "重要" : ""].filter(Boolean).join(" · ");
        return `<div class="msg ${isAdmin ? "admin" : "user"}"><div class="wrap"><div class="bubble">${esc(row["內容"] || "")}</div><div class="meta">${esc(meta)}</div></div></div>`;
      }).join("");
      els.messages.scrollTop = els.messages.scrollHeight;
      const suggestions = suggestionsFor(group);
      els.suggestions.innerHTML = suggestions.length ? suggestions.map((text) => `<button data-suggestion="${esc(text)}">${esc(text)}</button>`).join("") : '<span class="muted">目前沒有 AI 建議</span>';
      document.querySelectorAll("[data-suggestion]").forEach((btn) => { btn.onclick = () => { els.replyText.value = btn.dataset.suggestion; els.replyText.focus(); }; });
    }
    function renderAssistant(groups) {
      const group = groups.find((item) => item.userId === state.activeUserId) || groups[0];
      const suggestions = group ? suggestionsFor(group) : [];
      els.suggestionCount.textContent = String(suggestions.length);
      els.sideSuggestions.innerHTML = suggestions.length ? suggestions.map((text) => `<button class="sideBtn" data-side-suggestion="${esc(text)}">${esc(text)}</button>`).join("") : '<div class="muted">選擇對話後，AI 建議會顯示在這裡。</div>';
      document.querySelectorAll("[data-side-suggestion]").forEach((btn) => { btn.onclick = () => { els.replyText.value = btn.dataset.sideSuggestion; els.replyText.focus(); }; });
      els.metaStatus.textContent = group ? group.status : "無"; els.metaStatus.className = group ? statusClass(group.status) : "state neutral";
      els.profileState.textContent = group ? (group.hasRealName ? "已命名" : "待同步") : "無";
      setInputUnlessFocused(els.profileName, group && group.hasRealName ? group.displayName : "");
      setInputUnlessFocused(els.profileAvatar, group ? group.avatarUrl : "");
      els.profileHint.textContent = group && group.hasRealName ? "目前使用已儲存的顯示資料。" : "自動補抓失敗時，可手動固定顯示名稱。";
      els.tagGrid.innerHTML = TAG_OPTIONS.map((tag) => `<button class="tagChoice ${group && group.tags.includes(tag) ? "active" : ""}" data-tag="${esc(tag)}">${esc(tag)}</button>`).join("");
      document.querySelectorAll("[data-tag]").forEach((btn) => { btn.onclick = () => toggleTag(btn.dataset.tag); });
      els.noteInput.value = group ? group.note : "";
      els.alertCount.textContent = String(state.aiLogs.length);
      els.alertList.innerHTML = state.aiLogs.length ? state.aiLogs.map((row) => `<article class="alert"><strong>${esc(nameOf(row, row["用戶ID"]))} · ${esc(row["類別"] || "重要訊息")}</strong><p>${esc(row["內容"] || "")}</p><div class="time">${esc(row["狀態"] || "待處理")} · ${fmt(row["時間"])} · TG ${esc(row["TG通知"] || "")}</div></article>`).join("") : '<div class="muted">目前沒有客訴、負評、建議或重大風險通報。</div>';
    }

    function currentGroup() {
      const groups = state.threads.length ? state.threads.map(threadToGroup) : groupRows(state.chats);
      return groups.find((item) => item.userId === state.activeUserId);
    }
    function suggestionsFor(group) {
      const row = [...group.messages].reverse().find((item) => item["身份"] === "user");
      if (!row) return [];
      try { const value = typeof row["AI建議"] === "string" ? JSON.parse(row["AI建議"]) : row["AI建議"]; return Array.isArray(value) ? value.filter(Boolean) : []; } catch (_err) { return []; }
    }
    function metaFor(userId) { return state.chatMeta.find((row) => row["用戶ID"] === userId) || {}; }
    function parseTags(value) { return String(value || "").split(/[,，]/).map((v) => v.trim()).filter(Boolean); }
    function statusClass(status) {
      const s = String(status || "").trim();
      if (s.includes("待處理")) return "state danger";
      if (s.includes("待回覆")) return "state warn";
      if (s.includes("處理完畢") || s.includes("已回覆")) return "state dark";
      return "state neutral";
    }
    function isDoneStatus(status) { const s = String(status || ""); return s.includes("處理完畢") || s.includes("已回覆"); }
    function bestDisplayName(meta, messages, userId) {
      const metaName = nameOf(meta, "");
      if (metaName && !looksLikeUserId(metaName, userId)) return metaName;
      for (let i = messages.length - 1; i >= 0; i -= 1) {
        const value = nameOf(messages[i], "");
        if (value && !looksLikeUserId(value, userId)) return value;
      }
      return userId || "LINE 用戶";
    }
    function realName(group) { return group && group.hasRealName ? group.displayName : ""; }
    function looksLikeUserId(value, userId) {
      const text = String(value || "").trim();
      return !text || text === userId || /^U[a-z0-9]{8,}$/i.test(text) || /^用戶\s*[a-z0-9]{4,}$/i.test(text) || text === "unknown";
    }
    function nameOf(row, fallback) { const value = row && (row["用戶名稱"] || row.displayName || row.userName || row["姓名"]); return String(value || fallback || "").trim(); }
    function setInputUnlessFocused(input, value) { if (document.activeElement !== input) input.value = value || ""; }
    function initialOf(name) { return String(name || "U").trim().charAt(0).toUpperCase() || "U"; }
    function insertText(text) {
      const start = els.replyText.selectionStart || 0, end = els.replyText.selectionEnd || 0;
      els.replyText.value = els.replyText.value.slice(0, start) + text + els.replyText.value.slice(end);
      els.replyText.focus(); els.replyText.selectionStart = els.replyText.selectionEnd = start + text.length;
    }
    function applyFirstSuggestion() { const group = currentGroup(), suggestions = group ? suggestionsFor(group) : []; if (suggestions[0]) { els.replyText.value = suggestions[0]; els.replyText.focus(); } }
    function focusSearch() { els.searchBox.focus(); els.searchBox.select(); }
    function apiBase() {
      const value = sanitizeApiBase(els.apiBase.value);
      if (value !== els.apiBase.value) { els.apiBase.value = value; localStorage.setItem("line_ai_api_base", value); }
      return value;
    }
    function sanitizeApiBase(value) {
      const raw = String(value || "").trim().replace(/\/+$/, "");
      if (!raw || raw === "admin" || raw === "/admin") return DEFAULT_API_BASE;
      try {
        const url = new URL(raw, window.location.origin);
        const isStaticHost = url.hostname === window.location.hostname || url.hostname === "fangwl591021.github.io";
        if (isStaticHost || /\/admin$/i.test(url.pathname)) return DEFAULT_API_BASE;
        return url.origin + url.pathname.replace(/\/+$/, "");
      } catch (_err) { return DEFAULT_API_BASE; }
    }
    function authJsonHeaders() { return { "Content-Type": "application/json", Authorization: `Bearer ${els.apiToken.value.trim()}` }; }
    function setStatus(text, bad) { els.syncStatus.textContent = text; els.syncStatus.className = bad ? "pill bad" : "pill"; }
    function showError(text) { els.errorBox.innerHTML = text ? `<p class="error">${esc(text)}</p>` : ""; }
    function clearError() { showError(""); }
    function fmt(value) { const n = Number(value); return n ? new Date(n).toLocaleString("zh-TW", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }) : ""; }
    function esc(value) { return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }
  </script>
</body>
</html>
