<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DS PRO - Intelligent Matrix v5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0"
        }
    }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        body { 
            font-family: 'Inter', 'Noto Sans TC', sans-serif; 
            background-color: #ffffff; 
            color: #000000; 
            margin: 0; 
            overflow: hidden; 
        }

        /* 徹底解放版面：移除所有捲軸留白與圓角 */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; }
        
        /* LINE 原生對話 - 文字加深加重 */
        .line-bubble-user { 
            background-color: #ffffff; 
            border-radius: 16px; 
            border: 1.5px solid #e2e8f0;
            color: #000000;
            font-weight: 500;
        }

        .line-bubble-admin { 
            background-color: #06c755; 
            color: #ffffff; 
            border-radius: 16px;
            font-weight: 500;
        }
        
        /* 側邊欄活性塊 */
        .nav-active { 
            background: #0f172a; 
            color: #ffffff !important; 
        }

        .full-screen-container {
            height: 100vh;
            width: 100vw;
            display: flex;
        }

        .animate-in { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: translateY(0); } }

        .suggestion-chip {
            background-color: #ffffff;
            border: 2px solid #06c755;
            color: #06c755;
            padding: 10px 18px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 800;
            transition: all 0.15s;
            white-space: nowrap;
            box-shadow: 0 2px 4px rgba(6, 199, 85, 0.1);
        }
        .suggestion-chip:hover {
            background-color: #06c755;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            LayoutDashboard, MessageSquare, Calendar, BarChart, Bell, CheckCircle, 
            Search, Smartphone, Zap, Send, ShieldCheck, Lock, Activity, Settings, 
            ClipboardList, Plus, AlertTriangle, Sparkles, Bot, ChevronRight
        } from 'lucide-react';

        // ⚠️ 總監部署後請填入您的實體網址
        const WORKER_URL = "https://YOUR_WORKER_URL.workers.dev";

        const App = () => {
            const [view, setView] = useState('chat');
            const [user] = useState({ name: '系統管理員', role: 'admin', dept: '管理層' });
            const [chatTarget, setChatTarget] = useState(null);
            const [inputText, setInputText] = useState('');
            const chatEndRef = useRef(null);

            // --- 實時數據 State ---
            const [messages, setMessages] = useState([
                { id: 1, userId: 'U1202', sender: 'user', text: '請問負離子眼鏡適合哪些人戴？', time: '14:10', aiCategory: '產品諮詢', aiSuggestions: ['適合長時間使用3C的族群與學生。', '每天配戴8-10小時效果較明顯。'] }
            ]);
            const [isSyncing, setIsSyncing] = useState(false);
            const [syncError, setSyncError] = useState(false);

            // 每 5 秒同步一次對話 (包括歷史紀錄)
            useEffect(() => {
                const fetchDashboardData = async () => {
                    if (!WORKER_URL || WORKER_URL.includes("YOUR_WORKER_URL")) return;
                    try {
                        setIsSyncing(true);
                        const res = await fetch(`${WORKER_URL}/api/data`);
                        const json = await res.json();
                        if (json.status === "success" && json.data) {
                            const rawChats = json.data.chats || [];
                            const formattedMsgs = rawChats.map((r, i) => ({
                                id: i,
                                userId: r['用戶ID'],
                                sender: r['身份'] === 'admin' ? 'admin' : 'user',
                                text: r['內容'],
                                aiCategory: r['類別'],
                                aiSuggestions: r['AI建議'] ? JSON.parse(r['AI建議']) : null,
                                time: new Date(Number(r['時間'])).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                            })).reverse(); 
                            if(formattedMsgs.length > 0) setMessages(formattedMsgs);
                            setSyncError(false);
                        }
                    } catch (err) {
                        setSyncError(true);
                    } finally {
                        setIsSyncing(false);
                    }
                };
                fetchDashboardData();
                const interval = setInterval(fetchDashboardData, 5000);
                return () => clearInterval(interval);
            }, []);

            const chatList = useMemo(() => {
                const map = new Map();
                messages.forEach(m => {
                    map.set(m.userId, { id: m.userId, name: m.userId, lastMsg: m.text, time: m.time });
                });
                return Array.from(map.values());
            }, [messages]);

            const activeMessage = useMemo(() => {
                if (!chatTarget) return null;
                const userMsgs = messages.filter(m => m.userId === chatTarget.id && m.sender === 'user');
                return userMsgs[userMsgs.length - 1]; 
            }, [messages, chatTarget]);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [messages, chatTarget]);

            const handleSend = async () => {
                if (!inputText || !chatTarget) return;
                const tempText = inputText;
                setInputText('');
                
                setMessages(prev => [...prev, {
                    id: Date.now(),
                    userId: chatTarget.id,
                    sender: 'admin',
                    text: tempText,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                }]);

                if (WORKER_URL.includes("YOUR_WORKER_URL")) return;
                try {
                    await fetch(`${WORKER_URL}/api/send`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: chatTarget.id, text: tempText })
                    });
                } catch (e) { console.error(e); }
            };

            const renderChatTakeover = () => (
                <div className="flex h-full w-full bg-white animate-in">
                    {/* 左側：名單列 (徹底去框) */}
                    <div className="w-[380px] border-r border-slate-200 flex flex-col bg-white shrink-0">
                        <div className="p-6 border-b border-slate-200 bg-slate-50">
                            <div className="relative">
                                <Search className="absolute left-4 top-1/2 -translate-y-1/2 text-black" size={20} />
                                <input type="text" placeholder="搜尋 LINE 用戶..." className="w-full bg-white border-2 border-slate-200 rounded-lg py-3 pl-12 pr-4 text-[16px] focus:border-black outline-none font-bold text-black" />
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto custom-scrollbar">
                            {chatList.map(chat => (
                                <div key={chat.id} onClick={() => setChatTarget(chat)} className={`p-6 flex gap-4 cursor-pointer border-b border-slate-100 transition-colors ${chatTarget?.id === chat.id ? 'bg-slate-900 text-white' : 'hover:bg-slate-50'}`}>
                                    <div className={`w-14 h-14 rounded-full flex-shrink-0 flex items-center justify-center font-black text-xl uppercase ${chatTarget?.id === chat.id ? 'bg-white text-slate-900' : 'bg-slate-800 text-white'}`}>{chat.name[0]}</div>
                                    <div className="flex-1 min-w-0">
                                        <div className="flex justify-between items-baseline mb-1">
                                            <span className="text-[17px] font-black truncate">{chat.name}</span>
                                            <span className={`text-xs font-bold ${chatTarget?.id === chat.id ? 'text-slate-400' : 'text-slate-500'}`}>{chat.time}</span>
                                        </div>
                                        <p className={`text-[15px] truncate font-medium ${chatTarget?.id === chat.id ? 'text-slate-300' : 'text-slate-700'}`}>{chat.lastMsg}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* 右側：對話區 (滿版) */}
                    <div className="flex-1 flex flex-col bg-[#8bacce]">
                        {chatTarget ? (
                            <>
                                <div className="px-8 py-5 bg-white border-b border-slate-200 flex justify-between items-center z-10">
                                    <div className="flex items-center gap-4">
                                        <span className="text-[22px] font-black text-black">{chatTarget.name}</span>
                                        <span className="bg-[#06c755] text-white text-xs font-black px-3 py-1 rounded-full uppercase tracking-tighter">LINE 接管中</span>
                                    </div>
                                    <div className="flex items-center gap-2 text-black text-[14px] font-black">
                                        <Bot size={22} className="text-[#06c755]"/> AI 大腦已聯網 (K-Link 知識庫)
                                    </div>
                                </div>
                                
                                <div className="flex-1 overflow-y-auto custom-scrollbar p-10 space-y-8">
                                    {messages.filter(m => m.userId === chatTarget.id).map(msg => (
                                        <div key={msg.id} className={`flex flex-col ${msg.sender === 'admin' ? 'items-end' : 'items-start'}`}>
                                            {msg.sender === 'user' && msg.aiCategory && (
                                                <div className="flex gap-1 mb-2 ml-2">
                                                    <span className="text-xs bg-black text-white px-3 py-1 rounded font-black uppercase">{msg.aiCategory}</span>
                                                </div>
                                            )}
                                            <div className={`flex items-end gap-3 max-w-[85%] ${msg.sender === 'admin' ? 'flex-row' : 'flex-row-reverse'}`}>
                                                <span className="text-[11px] text-white font-black mb-1 drop-shadow-md">{msg.time}</span>
                                                <div className={`px-6 py-4 text-[17px] font-bold leading-relaxed shadow-lg ${msg.sender === 'admin' ? 'line-bubble-admin' : 'line-bubble-user'}`}>
                                                    {msg.text}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                    <div ref={chatEndRef} />
                                </div>

                                <div className="bg-white border-t-4 border-[#06c755]">
                                    {activeMessage?.aiSuggestions && (
                                        <div className="px-8 py-5 flex items-center gap-4 overflow-x-auto custom-scrollbar bg-slate-50 border-b border-slate-100">
                                            <div className="flex items-center text-black shrink-0">
                                                <Sparkles size={20} className="text-orange-500 mr-2"/>
                                                <span className="text-[14px] font-black uppercase">大腦建議</span>
                                            </div>
                                            {activeMessage.aiSuggestions.map((s, idx) => (
                                                <button key={idx} onClick={() => setInputText(s)} className="suggestion-chip">{s}</button>
                                            ))}
                                        </div>
                                    )}
                                    <div className="px-8 py-6 flex items-end gap-6">
                                        <button className="p-3 text-black hover:bg-slate-100 rounded-full transition-colors"><Plus size={36}/></button>
                                        <textarea value={inputText} onChange={(e) => setInputText(e.target.value)} placeholder="請輸入回覆內容..." className="flex-1 bg-slate-100 rounded-xl border-none px-6 py-4 text-[18px] outline-none resize-none min-h-[60px] max-h-[150px] font-black text-black placeholder:text-slate-400" rows="1" onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } }} />
                                        <button onClick={handleSend} className="p-5 bg-[#06c755] text-white rounded-full hover:bg-[#05a64a] shadow-xl transition-all mb-1"><Send size={30}/></button>
                                    </div>
                                </div>
                            </>
                        ) : (
                            <div className="flex-1 flex flex-col items-center justify-center text-white animate-in">
                                <MessageSquare size={100} strokeWidth={1} className="mb-6 opacity-30" />
                                <p className="text-2xl font-black tracking-widest uppercase">選擇 LINE 用戶開始對話</p>
                            </div>
                        )}
                    </div>
                </div>
            );

            return (
                <div className="full-screen-container">
                    <aside className="w-[280px] bg-slate-900 flex flex-col h-full shrink-0">
                        <div className="p-10 bg-slate-800 border-b border-slate-700">
                            <h1 className="text-3xl font-black tracking-tighter text-white uppercase leading-none">DS PRO</h1>
                            <p className="text-[10px] font-black text-slate-400 mt-3 tracking-[0.4em] uppercase">Victory Matrix</p>
                        </div>
                        <nav className="flex-1 p-4 space-y-3">
                            <NavItem icon={LayoutDashboard} label="營運看板" active={view === 'overview'} onClick={() => setView('overview')} />
                            <NavItem icon={MessageSquare} label="LINE 接管" active={view === 'chat'} onClick={() => setView('chat')} />
                            <NavItem icon={ShieldCheck} label="權限矩陣" active={view === 'crm'} onClick={() => setView('crm')} />
                        </nav>
                        <div className="p-8 bg-slate-800 border-t border-slate-700">
                            <div className={`flex items-center gap-3 text-sm font-black ${syncError ? 'text-red-500' : 'text-green-400'}`}>
                                <div className={`w-3 h-3 rounded-full ${syncError ? 'bg-red-500' : 'bg-green-400 animate-pulse'}`}></div>
                                {syncError ? 'DISCONNECTED' : 'BRAIN ONLINE'}
                            </div>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col bg-white overflow-hidden">
                        {view === 'chat' ? renderChatTakeover() : (
                            <div className="p-20 text-center animate-in">
                                <Activity size={80} className="mx-auto text-slate-200 mb-8" />
                                <p className="text-black font-black text-3xl uppercase tracking-widest">資料模組串接中</p>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        function NavItem({ icon: Icon, label, active, onClick }) {
            return (
                <button onClick={onClick} className={`w-full flex items-center gap-5 px-6 py-6 rounded-xl transition-all font-black text-[18px] ${active ? 'nav-active shadow-2xl' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                    <Icon size={26} strokeWidth={active ? 3 : 2} />
                    <span>{label}</span>
                </button>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
