name: MLM Modular Staging Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/staging-preflight.mjs"
      - "wrangler.staging.toml"
      - ".github/workflows/mlm-modular-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check modular files
        run: |
          node --check src/app.js
          node --check src/index.js
          node --check src/router/router.js
          node --check src/modules/system/system.routes.js
          node --check src/modules/frontend/frontend.routes.js
          node --check src/modules/console/console-summary.routes.js
          node --check src/modules/calendar/calendar-events.routes.js
          node --check src/modules/knowledge/knowledge-read.routes.js
          node --check src/modules/ai-wear/ai-wear-public.routes.js
          node --check src/modules/ai-wear/ai-wear-gallery.routes.js
          node --check src/shadow/shadow-compare.js
          node --check src/legacy/legacy-fetch.js
          node --check tests/modular-router.test.mjs
          node --check tests/frontend-routes.test.mjs
          node --check tests/shadow-compare.test.mjs
          node --check tests/console-summary-shadow.test.mjs
          node --check tests/calendar-events-shadow.test.mjs
          node --check tests/knowledge-read-shadow.test.mjs
          node --check tests/ai-wear-public-shadow.test.mjs
          node --check tests/ai-wear-gallery-shadow.test.mjs
          node --check tools/staging-preflight.mjs

      - name: Run read-only modular regression tests
        run: node --test tests/modular-router.test.mjs tests/frontend-routes.test.mjs tests/shadow-compare.test.mjs tests/console-summary-shadow.test.mjs tests/calendar-events-shadow.test.mjs tests/knowledge-read-shadow.test.mjs tests/ai-wear-public-shadow.test.mjs tests/ai-wear-gallery-shadow.test.mjs

      - name: Run staging safety preflight
        run: node tools/staging-preflight.mjs wrangler.staging.toml

      - name: Verify production entry files are untouched by Batch A
        shell: bash
        run: |
          git diff --exit-code origin/${{ github.base_ref || 'main' }}...HEAD -- worker/worker.js wrangler.toml
