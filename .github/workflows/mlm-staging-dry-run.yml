name: MLM Staging Dry Run

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "scripts/wrangler-staging-dry-run.sh"
      - "tools/staging-preflight.mjs"
      - "wrangler.staging.toml"
      - ".github/workflows/mlm-staging-dry-run.yml"

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify production entry files remain untouched
        run: git diff --exit-code origin/${{ github.base_ref || 'main' }}...HEAD -- worker/worker.js wrangler.toml

      - name: Validate staging configuration
        run: node tools/staging-preflight.mjs wrangler.staging.toml

      - name: Bundle staging Worker without deployment
        run: bash scripts/wrangler-staging-dry-run.sh
