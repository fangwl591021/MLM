<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LINE OA AI 建議後台</title>
  <style>
    :root {
      color-scheme: light;
      --line: #06c755;
      --line-dark: #00a844;
      --ink: #1f2329;
      --muted: #7b8494;
      --border: #e4e8ef;
      --panel: #ffffff;
      --soft: #f6f7f9;
      --chat-bg: #b7c6d8;
      --danger: #d92d20;
      --warn: #b54708;
      --rail: #12171f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, "Noto Sans TC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--soft);
      color: var(--ink);
      overflow: hidden;
    }

    button, input, textarea {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: 72px 332px minmax(0, 1fr) 360px;
      height: 100vh;
      min-width: 1180px;
    }

    .rail {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 14px 10px;
      background: var(--rail);
      color: #fff;
    }

    .rail-logo {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--line);
      font-weight: 950;
      font-size: 11px;
      letter-spacing: .02em;
    }

    .rail-button {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #aab4c3;
      font-size: 12px;
      font-weight: 950;
      cursor: pointer;
    }

    .rail-button.active {
      background: #24303f;
      color: #fff;
    }

    .rail-spacer {
      flex: 1;
    }

    .sidebar, .chat, .alerts {
      min-height: 0;
      background: var(--panel);
      border-right: 1px solid var(--border);
    }

    .alerts {
      border-right: 0;
      border-left: 1px solid var(--border);
    }

    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      background: #fff;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 850;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: var(--line);
      color: #fff;
      font-weight: 950;
      font-size: 12px;
    }

    .brand small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
    }

    .settings {
      display: grid;
      gap: 7px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: #f8fafb;
    }

    .settings input {
      width: 100%;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0 10px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    .settings label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 800;
    }

    .list {
      height: calc(100vh - 64px - 160px);
      overflow: auto;
    }

    .chat-item {
      width: 100%;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr);
      gap: 12px;
      padding: 14px 16px;
      border: 0;
      border-bottom: 1px solid #eef1f6;
      background: #fff;
      text-align: left;
      cursor: pointer;
    }

    .chat-item:hover, .chat-item.active {
      background: #eefbf4;
    }

    .chat-item.active {
      box-shadow: inset 4px 0 0 var(--line);
    }

    .avatar {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #dfe5ed;
      color: var(--ink);
      font-weight: 950;
    }

    .chat-meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
      font-size: 13px;
      font-weight: 850;
    }

    .time {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .preview {
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat {
      display: grid;
      grid-template-rows: 64px auto minmax(0, 1fr) auto;
    }

    .chat-title {
      min-width: 0;
    }

    .chat-title h1 {
      margin: 0;
      overflow: hidden;
      font-size: 17px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-title p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .status-pill {
      border: 1px solid #bee8ce;
      border-radius: 999px;
      padding: 5px 10px;
      background: #ecfdf3;
      color: #067647;
      font-size: 11px;
      font-weight: 950;
      white-space: nowrap;
    }

    .messages {
      overflow: auto;
      padding: 22px 28px;
      background:
        linear-gradient(rgba(255,255,255,.14) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.12) 1px, transparent 1px),
        var(--chat-bg);
      background-size: 36px 36px;
    }

    .message {
      display: flex;
      margin: 0 0 16px;
    }

    .message.admin {
      justify-content: flex-end;
    }

    .bubble {
      max-width: min(680px, 76%);
      padding: 10px 13px;
      border-radius: 6px 18px 18px 18px;
      border: 0;
      background: #fff;
      line-height: 1.55;
      font-size: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .admin .bubble {
      border-radius: 18px 6px 18px 18px;
      background: var(--line);
      color: #07130b;
    }

    .bubble-meta {
      margin-top: 6px;
      color: rgba(31,35,41,.72);
      font-size: 11px;
      font-weight: 700;
    }

    .composer {
      border-top: 1px solid var(--border);
      background: #fff;
    }

    .suggestions {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      overflow-x: auto;
      border-bottom: 1px solid #eef1f6;
      background: #f7fbf8;
    }

    .suggestions button {
      flex: 0 0 auto;
      max-width: 420px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 12px;
      background: #fff;
      color: #067a35;
      font-size: 13px;
      font-weight: 850;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .send-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 42px;
      gap: 10px;
      padding: 12px 16px;
    }

    textarea {
      min-height: 42px;
      max-height: 140px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      outline: none;
      line-height: 1.45;
      background: #f8fafb;
    }

    .send {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: var(--line);
      color: #07130b;
      font-weight: 900;
      cursor: pointer;
    }

    .section-title {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      font-weight: 900;
      background: #fff;
    }

    .alert-list {
      height: calc(100vh - 64px);
      overflow: auto;
      padding: 14px 16px;
      background: #f8fafb;
    }

    .alert-card {
      margin-bottom: 12px;
      border: 1px solid #ffd7b0;
      border-left: 4px solid #f79009;
      border-radius: 6px;
      padding: 12px;
      background: #fff8f0;
    }

    .alert-card strong {
      display: block;
      color: var(--warn);
      font-size: 13px;
      margin-bottom: 6px;
    }

    .alert-card p {
      margin: 0 0 8px;
      color: var(--ink);
      font-size: 13px;
      line-height: 1.45;
    }

    .empty {
      display: grid;
      place-items: center;
      height: 100%;
      color: var(--muted);
      font-weight: 800;
      text-align: center;
      padding: 24px;
    }

    .error {
      margin: 0;
      padding: 8px 16px;
      background: #fff1f3;
      color: var(--danger);
      font-size: 12px;
      font-weight: 800;
    }

    @media (max-width: 900px) {
      body { overflow: auto; }

      .app {
        grid-template-columns: 56px minmax(280px, 36vw) minmax(420px, 1fr);
        min-width: 0;
        width: max-content;
      }

      .alerts {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <nav class="rail" aria-label="LINE OA navigation">
      <div class="rail-logo">LINE</div>
      <button class="rail-button active" title="聊天">C</button>
      <button class="rail-button" title="AI 建議">AI</button>
      <button class="rail-button" title="重要紀錄">!</button>
      <div class="rail-spacer"></div>
      <button class="rail-button" title="設定">SET</button>
    </nav>

    <aside class="sidebar">
      <div class="topbar">
        <div class="brand">
          <div class="brand-mark">OA</div>
          <div>
            LINE OA 管理後台
            <small>聊天室接管與 AI 建議</small>
          </div>
        </div>
      </div>

      <div class="settings">
        <label for="apiBase">Worker API URL</label>
        <input id="apiBase" placeholder="https://your-worker.workers.dev" />
        <label for="apiToken">Dashboard Token</label>
        <input id="apiToken" type="password" placeholder="Bearer token" />
      </div>

      <div id="chatList" class="list"></div>
    </aside>

    <main class="chat">
      <div class="topbar">
        <div class="chat-title">
          <h1 id="activeTitle">請選擇 LINE 對話</h1>
          <p id="activeSubtitle">AI 只提供建議，不會自動回覆客戶</p>
        </div>
        <div class="status-pill" id="syncStatus">待同步</div>
      </div>

      <div id="errorBox"></div>
      <div id="messages" class="messages">
        <div class="empty">左側選擇用戶後，聊天室會出現在這裡。</div>
      </div>

      <div class="composer">
        <div id="suggestions" class="suggestions"></div>
        <div class="send-row">
          <textarea id="replyText" placeholder="管理員手動輸入或點選 AI 建議後送出"></textarea>
          <button id="sendButton" class="send" title="送出">➤</button>
        </div>
      </div>
    </main>

    <aside class="alerts">
      <div class="section-title">
        <span>AI 監看</span>
        <span class="time" id="alertCount">0</span>
      </div>
      <div id="alertList" class="alert-list"></div>
    </aside>
  </div>

  <script>
    const els = {
      apiBase: document.getElementById("apiBase"),
      apiToken: document.getElementById("apiToken"),
      chatList: document.getElementById("chatList"),
      messages: document.getElementById("messages"),
      suggestions: document.getElementById("suggestions"),
      replyText: document.getElementById("replyText"),
      sendButton: document.getElementById("sendButton"),
      activeTitle: document.getElementById("activeTitle"),
      activeSubtitle: document.getElementById("activeSubtitle"),
      syncStatus: document.getElementById("syncStatus"),
      alertList: document.getElementById("alertList"),
      alertCount: document.getElementById("alertCount"),
      errorBox: document.getElementById("errorBox"),
    };

    const state = {
      chats: [],
      aiLogs: [],
      activeUserId: "",
      timer: null,
    };

    els.apiBase.value = localStorage.getItem("line_ai_api_base") || "";
    els.apiToken.value = localStorage.getItem("line_ai_api_token") || "";

    els.apiBase.addEventListener("change", persistSettings);
    els.apiToken.addEventListener("change", persistSettings);
    els.sendButton.addEventListener("click", sendReply);
    els.replyText.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) sendReply();
    });

    syncNow();
    state.timer = setInterval(syncNow, 5000);

    function persistSettings() {
      localStorage.setItem("line_ai_api_base", els.apiBase.value.trim());
      localStorage.setItem("line_ai_api_token", els.apiToken.value.trim());
      syncNow();
    }

    async function syncNow() {
      const apiBase = normalizeApiBase();
      const token = els.apiToken.value.trim();
      if (!apiBase || !token) {
        setStatus("請先設定 API", true);
        return;
      }

      try {
        setStatus("同步中", false);
        const response = await fetch(`${apiBase}/api/data`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        const json = await response.json();
        if (!response.ok || json.status !== "success") throw new Error(json.message || "同步失敗");

        state.chats = Array.isArray(json.data.chats) ? json.data.chats : [];
        state.aiLogs = Array.isArray(json.data.aiLogs) ? json.data.aiLogs : [];
        renderAll();
        setError("");
        setStatus("已同步", false);
      } catch (err) {
        setStatus("同步失敗", true);
        setError(err.message || String(err));
      }
    }

    async function sendReply() {
      const apiBase = normalizeApiBase();
      const token = els.apiToken.value.trim();
      const text = els.replyText.value.trim();
      if (!apiBase || !token || !state.activeUserId || !text) return;

      try {
        els.sendButton.disabled = true;
        const response = await fetch(`${apiBase}/api/send`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({
            userId: state.activeUserId,
            text,
          }),
        });
        const json = await response.json();
        if (!response.ok || json.status !== "success") throw new Error(json.message || "送出失敗");

        els.replyText.value = "";
        await syncNow();
      } catch (err) {
        setError(err.message || String(err));
      } finally {
        els.sendButton.disabled = false;
      }
    }

    function renderAll() {
      const groups = groupByUser(state.chats);
      renderChatList(groups);
      renderMessages(groups);
      renderAlerts();
    }

    function groupByUser(rows) {
      const map = new Map();
      rows.slice().reverse().forEach((row) => {
        const userId = row["用戶ID"] || "unknown";
        if (!map.has(userId)) map.set(userId, []);
        map.get(userId).push(row);
      });
      return Array.from(map.entries())
        .map(([userId, messages]) => ({ userId, messages, last: messages[messages.length - 1] }))
        .sort((a, b) => Number(b.last["時間"] || 0) - Number(a.last["時間"] || 0));
    }

    function renderChatList(groups) {
      if (!state.activeUserId && groups[0]) state.activeUserId = groups[0].userId;
      if (!groups.length) {
        els.chatList.innerHTML = '<div class="empty">尚無 LINE 對話紀錄</div>';
        return;
      }

      els.chatList.innerHTML = groups.map((group) => {
        const last = group.last || {};
        const active = group.userId === state.activeUserId ? " active" : "";
        const important = last["重要"] === "是" ? "・重要" : "";
        return `
          <button class="chat-item${active}" data-user-id="${escapeHtml(group.userId)}">
            <div class="avatar">${escapeHtml(group.userId.slice(0, 1).toUpperCase())}</div>
            <div>
              <div class="chat-meta">
                <span>${escapeHtml(group.userId)}</span>
                <span class="time">${formatTime(last["時間"])}</span>
              </div>
              <div class="preview">${escapeHtml(last["內容"] || "")}${important}</div>
            </div>
          </button>
        `;
      }).join("");

      document.querySelectorAll(".chat-item").forEach((button) => {
        button.addEventListener("click", () => {
          state.activeUserId = button.dataset.userId;
          renderAll();
        });
      });
    }

    function renderMessages(groups) {
      const group = groups.find((item) => item.userId === state.activeUserId);
      if (!group) {
        els.messages.innerHTML = '<div class="empty">尚未選擇對話</div>';
        els.suggestions.innerHTML = "";
        return;
      }

      els.activeTitle.textContent = group.userId;
      els.activeSubtitle.textContent = `共 ${group.messages.length} 則訊息，AI 建議僅供管理員參考`;

      els.messages.innerHTML = group.messages.map((msg) => {
        const isAdmin = msg["身份"] === "admin";
        const meta = [
          formatTime(msg["時間"]),
          msg["類別"] || "",
          msg["重要"] === "是" ? "重要" : "",
        ].filter(Boolean).join(" · ");
        return `
          <div class="message ${isAdmin ? "admin" : "user"}">
            <div>
              <div class="bubble">${escapeHtml(msg["內容"] || "")}</div>
              <div class="bubble-meta">${escapeHtml(meta)}</div>
            </div>
          </div>
        `;
      }).join("");
      els.messages.scrollTop = els.messages.scrollHeight;

      const latestUserMessage = [...group.messages].reverse().find((msg) => msg["身份"] === "user");
      const suggestions = parseSuggestions(latestUserMessage && latestUserMessage["AI建議"]);
      els.suggestions.innerHTML = suggestions.length ? suggestions.map((item) => (
        `<button type="button" data-suggestion="${escapeHtml(item)}">${escapeHtml(item)}</button>`
      )).join("") : '<span class="time">目前沒有 AI 建議</span>';

      document.querySelectorAll("[data-suggestion]").forEach((button) => {
        button.addEventListener("click", () => {
          els.replyText.value = button.dataset.suggestion;
          els.replyText.focus();
        });
      });
    }

    function renderAlerts() {
      els.alertCount.textContent = String(state.aiLogs.length);
      if (!state.aiLogs.length) {
        els.alertList.innerHTML = '<div class="empty">尚無客訴、負評或建議等重要訊息</div>';
        return;
      }

      els.alertList.innerHTML = state.aiLogs.map((log) => `
        <article class="alert-card">
          <strong>${escapeHtml(log["類別"] || "重要訊息")} · ${escapeHtml(log["狀態"] || "待處理")}</strong>
          <p>${escapeHtml(log["內容"] || "")}</p>
          <div class="time">${escapeHtml(log["用戶ID"] || "")} · ${formatTime(log["時間"])} · TG ${escapeHtml(log["TG通知"] || "")}</div>
        </article>
      `).join("");
    }

    function parseSuggestions(raw) {
      if (!raw) return [];
      try {
        const parsed = typeof raw === "string" ? JSON.parse(raw) : raw;
        return Array.isArray(parsed) ? parsed.filter(Boolean) : [];
      } catch (_err) {
        return [];
      }
    }

    function normalizeApiBase() {
      return els.apiBase.value.trim().replace(/\/+$/, "");
    }

    function setStatus(text, isError) {
      els.syncStatus.textContent = text;
      els.syncStatus.style.background = isError ? "#fff1f3" : "#ecfdf3";
      els.syncStatus.style.color = isError ? "#d92d20" : "#067647";
      els.syncStatus.style.borderColor = isError ? "#fecdd3" : "#bee8ce";
    }

    function setError(message) {
      els.errorBox.innerHTML = message ? `<p class="error">${escapeHtml(message)}</p>` : "";
    }

    function formatTime(value) {
      const number = Number(value);
      if (!number) return "";
      return new Date(number).toLocaleString("zh-TW", {
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
