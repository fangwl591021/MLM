<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>機器人與專區卡片</title><style>:root{--g:#06c755;--ink:#172033;--muted:#667085;--line:#dbe3ee;--soft:#f6f8fb;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif}button,input,select,textarea{font:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:260px 1fr}.side{background:#fff;border-right:1px solid var(--line);padding:24px}.brand{font-size:22px;font-weight:900;color:var(--g);margin-bottom:28px}.nav{display:grid;gap:8px}.nav a{padding:12px 14px;border-radius:12px;color:#344054;text-decoration:none;font-weight:800}.nav a.active,.nav a:hover{background:#effcf4;color:#067a35}.main{padding:28px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.top h1{margin:0;font-size:28px}.top p{margin:6px 0 0;color:var(--muted)}.button{border:1px solid var(--line);border-radius:10px;background:#fff;color:#344054;padding:10px 14px;font-weight:850;cursor:pointer}.primary{background:var(--g);border-color:var(--g);color:#fff}.danger{color:var(--red);border-color:#fecdd3}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:14px 16px;border-bottom:1px solid #edf1f5;text-align:left;vertical-align:top}.table th{background:#f8fafc;color:var(--muted);font-size:13px}.table td:last-child,.table th:last-child{text-align:right}.pill{display:inline-flex;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:850}.green{background:#e7f8ef;color:#067a35}.gray{background:#eef2f7;color:#344054}.red{background:#fff1f3;color:var(--red)}.empty{padding:48px;text-align:center;color:var(--muted)}.status{min-height:22px;margin:14px;color:var(--muted)}.status.bad{color:var(--red)}.modal{position:fixed;inset:0;background:#17203366;display:grid;place-items:center;padding:20px}.modal[hidden]{display:none}.dialog{width:min(720px,100%);background:#fff;border-radius:16px;padding:22px;box-shadow:0 20px 60px #17203333}.dialogHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.dialog h2{margin:0}.form{display:grid;gap:14px}.form label{display:grid;gap:6px;font-weight:800;color:#344054}.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.form textarea{min-height:160px;resize:vertical;font-family:ui-monospace,monospace;font-size:13px}.check{display:flex!important;align-items:center;gap:8px}.check input{width:auto}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}@media(max-width:760px){.shell{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}.main{padding:18px}.top{align-items:flex-start;flex-direction:column}.table{min-width:680px}.panel{overflow:auto}}</style></head><body><div class="shell"><aside class="side"><div class="brand">KLINK 管理主控台</div><nav class="nav"><a href="/console">綜合主控台</a><a class="active" href="/action-admin?view=flex_rules">機器人與專區卡片</a><a href="/checkin-template">簽到模板</a></nav></aside><main class="main"><div class="top"><div><h1>自動回覆與會員專區卡片</h1><p>建立關鍵字觸發規則，供 MLM 內部管理使用。</p></div><button class="button primary" id="add">新增觸發規則</button></div><div class="panel"><table class="table"><thead><tr><th>觸發關鍵字</th><th>回覆類型</th><th>狀態</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table><div class="status" id="status"></div></div></main></div><div class="modal" id="modal" hidden><div class="dialog"><div class="dialogHead"><h2 id="dialogTitle">新增觸發規則</h2><button class="button" id="close">關閉</button></div><form class="form" id="form"><label>觸發關鍵字<textarea id="keyword" required></textarea></label><label>回覆類型<select id="replyType"><option value="FLEX">FLEX 卡片</option><option value="TEXT">純文字</option></select></label><label>回覆內容（JSON 或文字）<textarea id="payload" required></textarea></label><label class="check"><input id="active" type="checkbox" checked> 啟用規則</label><div class="actions"><button type="button" class="button" id="cancel">取消</button><button class="button primary">儲存</button></div></form></div></div><script>const $=id=>document.getElementById(id);let rules=[],editing=null;function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function setStatus(t,b){$('status').textContent=t||'';$('status').className='status'+(b?' bad':'')}function render(){ $('rows').innerHTML=rules.length?rules.map(r=>`<tr><td><strong>${esc(r.keyword)}</strong></td><td><span class="pill ${r.replyType==='FLEX'?'green':'gray'}">${r.replyType==='FLEX'?'FLEX 卡片':'純文字'}</span></td><td><span class="pill ${r.active===false?'red':'green'}">${r.active===false?'已停用':'啟用中'}</span></td><td><button class="button" data-edit="${esc(r.id)}">編輯</button> <button class="button danger" data-delete="${esc(r.id)}">刪除</button></td></tr>`).join(''):'<tr><td colspan="4" class="empty">尚無設定任何觸發規則</td></tr>'}async function api(path,opt={}){const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'操作失敗');return d.data??d}async function load(){try{rules=await api('/api/action/flex-rules');render();setStatus('')}catch(e){setStatus(e.message,true)}}function open(r){editing=r?JSON.parse(JSON.stringify(r)):{id:'FR_'+Date.now(),keyword:'',replyType:'FLEX',payload:'',active:true};$('dialogTitle').textContent=r?'編輯觸發規則':'新增觸發規則';$('keyword').value=editing.keyword||'';$('replyType').value=editing.replyType||'FLEX';$('payload').value=editing.payload||'';$('active').checked=editing.active!==false;$('modal').hidden=false}function close(){$('modal').hidden=true;editing=null}$('add').onclick=()=>open();$('close').onclick=close;$('cancel').onclick=close;$('form').onsubmit=async e=>{e.preventDefault();const d={...editing,keyword:$('keyword').value.trim(),replyType:$('replyType').value,payload:$('payload').value,active:$('active').checked};if(!d.keyword||!d.payload)return;try{await api('/api/action/flex-rules',{method:'POST',body:JSON.stringify(d)});close();await load()}catch(err){setStatus(err.message,true)}};$('rows').onclick=async e=>{const x=e.target.closest('[data-edit]'),d=e.target.closest('[data-delete]');if(x)open(rules.find(r=>r.id===x.dataset.edit));if(d&&confirm('確定要刪除此規則嗎？'))try{await api('/api/action/flex-rules?id='+encodeURIComponent(d.dataset.delete),{method:'DELETE'});await load()}catch(err){setStatus(err.message,true)}};load();</script></body></html>
