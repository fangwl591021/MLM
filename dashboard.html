<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DS PRO - 直銷管理整合系統</title>
    <!-- 載入外部資源 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 替換為極致穩定且零編譯衝突的 Google Material Symbols 圖示庫 -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
        
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        /* LINE 原生風格泡泡 - 遵照不包框、不浪費空間原則 */
        .line-bubble-user {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 2px 14px 14px 14px;
        }

        .line-bubble-admin {
            background-color: #06c755; 
            color: white;
            border-radius: 14px 2px 14px 14px;
        }

        .suggestion-chip {
            background-color: white;
            border: 1px solid #06c755;
            color: #06c755;
            transition: all 0.2s;
        }
        
        .suggestion-chip:hover {
            background-color: #06c755;
            color: white;
        }

        .nav-active {
            background: #2563eb;
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .animate-in {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 圖示共用樣式 */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        
        // --- 核心圖示組件 (取代 Lucide 以避免所有 UMD 編譯與 forwardRef 崩潰) ---
        const Icon = ({ name, size = 24, className = '', style = {} }) => (
            <span className={`material-symbols-outlined ${className}`} style={{ fontSize: size, ...style }}>
                {name}
            </span>
        );

        const App = () => {
            const [view, setView] = useState('chat'); // 預設進入聊天接管
            const [user] = useState({ name: '系統管理員', role: 'admin', dept: '決策層' });
            const [chatTarget, setChatTarget] = useState(null);
            const [inputText, setInputText] = useState('');
            const chatEndRef = useRef(null);

            // --- 業務數據 (模擬接管後的 AI 分析資訊流) ---
            const [messages, setMessages] = useState([
                { 
                    id: 1, userId: 'U8819', sender: 'user', 
                    text: '請問這個月的獎金計算方式有調整嗎？', time: '14:05',
                    aiCategory: '獎金制度',
                    aiSuggestions: ['本月制度無更動，可參考官網附件。', '您好，詳細撥款時間預計在15號。']
                },
                { id: 2, userId: 'U8819', sender: 'admin', text: '您好，本月維持原獎金制度，若有變動會於官網公告。', time: '14:06' },
                { 
                    id: 3, userId: 'U1202', sender: 'user', 
                    text: 'NFC 報到感應沒反應，請問該怎麼處理？', time: '14:10',
                    aiCategory: '硬體排除',
                    aiSuggestions: ['請確認手機 NFC 功能已開啟。', '可以嘗試將手機靠近標籤中心點感應。', '若持續失敗，請手動輸入站點代碼。']
                }
            ]);

            const chatList = [
                { id: 'U8819', name: '林大華', lastMsg: '您好，本月維持原獎...', time: '14:06', unread: 0, status: 'online' },
                { id: 'U1202', name: '陳小美', lastMsg: 'NFC 報到感應沒反應...', time: '14:10', unread: 1, status: 'away' },
                { id: 'U5543', name: '張大名', lastMsg: '感謝回覆', time: '昨日', unread: 0, status: 'offline' }
            ];

            const activeMessage = useMemo(() => {
                if (!chatTarget) return null;
                const userMsgs = messages.filter(m => m.userId === chatTarget.id && m.sender === 'user');
                return userMsgs[userMsgs.length - 1]; // 獲取用戶最後一則訊息進行建議回覆
            }, [messages, chatTarget]);

            // --- 滾動與發送邏輯 ---
            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [messages, chatTarget]);

            const handleSend = () => {
                if (!inputText || !chatTarget) return;
                const newMsg = {
                    id: Date.now(),
                    userId: chatTarget.id,
                    sender: 'admin',
                    text: inputText,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };
                setMessages(prev => [...prev, newMsg]);
                setInputText('');
            };

            // --- 元件：LINE 接管聊天室 (含 AI 建議回覆) ---
            const ChatTakeover = () => (
                <div className="bg-white rounded-[32px] border border-slate-100 shadow-sm flex h-[78vh] overflow-hidden animate-in">
                    {/* 左側對話清單 */}
                    <div className="w-80 border-r border-slate-50 flex flex-col bg-white">
                        <div className="p-5 border-b border-slate-50">
                            <div className="relative">
                                <Icon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-300" />
                                <input type="text" placeholder="搜尋 LINE 用戶..." className="w-full bg-slate-50 border-none rounded-xl py-2.5 pl-9 pr-4 text-xs focus:ring-2 focus:ring-blue-100 outline-none font-medium" />
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto custom-scrollbar">
                            {chatList.map(chat => (
                                <div 
                                    key={chat.id} 
                                    onClick={() => setChatTarget(chat)}
                                    className={`p-4 flex gap-3 cursor-pointer transition-all border-b border-slate-50/50 ${chatTarget?.id === chat.id ? 'bg-blue-50/50 border-l-4 border-l-blue-600' : 'hover:bg-slate-50'}`}
                                >
                                    <div className="relative">
                                        <div className="w-11 h-11 bg-slate-100 rounded-2xl flex-shrink-0 flex items-center justify-center font-bold text-slate-500 uppercase">{chat.name[0]}</div>
                                        {chat.status === 'online' && <div className="absolute -bottom-1 -right-1 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></div>}
                                    </div>
                                    <div className="flex-1 overflow-hidden">
                                        <div className="flex justify-between items-baseline mb-0.5">
                                            <span className="text-xs font-bold truncate text-slate-800">{chat.name}</span>
                                            <span className="text-[9px] text-slate-400 font-mono">{chat.time}</span>
                                        </div>
                                        <p className="text-[10px] text-slate-400 truncate tracking-tight">{chat.lastMsg}</p>
                                    </div>
                                    {chat.unread > 0 && <div className="min-w-[18px] h-[18px] bg-red-500 text-white text-[9px] font-bold flex items-center justify-center rounded-full mt-2 shadow-sm">{chat.unread}</div>}
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* 右側聊天視窗 */}
                    <div className="flex-1 flex flex-col bg-[#F4F7F9]">
                        {chatTarget ? (
                            <>
                                <div className="p-4 bg-white border-b border-slate-50 flex justify-between items-center z-10 shadow-sm">
                                    <div className="flex items-center gap-3">
                                        <div className="w-9 h-9 bg-blue-100 rounded-2xl flex items-center justify-center text-blue-600 text-[10px] font-bold uppercase tracking-widest">{chatTarget.name[0]}</div>
                                        <div>
                                            <span className="text-sm font-bold text-slate-800">{chatTarget.name}</span>
                                            <p className="text-[9px] text-green-500 font-black uppercase tracking-widest">已接管此對話傳送</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-4 text-slate-400">
                                        <button className="p-2 hover:bg-slate-50 rounded-xl transition-colors"><Icon name="monitoring" size={20} /></button>
                                        <button className="p-2 hover:bg-slate-50 rounded-xl transition-colors"><Icon name="settings" size={20} /></button>
                                    </div>
                                </div>
                                
                                <div className="flex-1 overflow-y-auto custom-scrollbar p-6 space-y-5">
                                    {messages.filter(m => m.userId === chatTarget.id).map(msg => (
                                        <div key={msg.id} className={`flex flex-col ${msg.sender === 'admin' ? 'items-end' : 'items-start'}`}>
                                            {msg.sender === 'user' && msg.aiCategory && (
                                                <span className="text-[9px] font-black text-blue-500 mb-1 flex items-center gap-1 uppercase tracking-widest">
                                                    <Icon name="smart_toy" size={12} className="mr-0.5" /> AI 分類：{msg.aiCategory}
                                                </span>
                                            )}
                                            <div className="max-w-[75%]">
                                                <div className={`p-3.5 text-xs shadow-sm leading-relaxed ${msg.sender === 'admin' ? 'line-bubble-admin' : 'line-bubble-user font-medium text-slate-700'}`}>
                                                    {msg.text}
                                                </div>
                                                <p className={`text-[9px] mt-1 text-slate-400 font-mono font-bold ${msg.sender === 'admin' ? 'text-right' : 'text-left'}`}>{msg.time}</p>
                                            </div>
                                        </div>
                                    ))}
                                    <div ref={chatEndRef} />
                                </div>

                                {/* AI 建議回覆區塊 */}
                                <div className="p-4 bg-white/60 backdrop-blur-sm border-t border-slate-100">
                                    {activeMessage?.aiSuggestions && (
                                        <div className="mb-4">
                                            <div className="flex items-center gap-1.5 mb-2 px-1">
                                                <Icon name="auto_awesome" size={14} className="text-orange-400" />
                                                <span className="text-[10px] font-black uppercase text-slate-400 tracking-widest">AI 建議回覆：內容已根據知識庫優化</span>
                                            </div>
                                            <div className="flex flex-wrap gap-2">
                                                {activeMessage.aiSuggestions.map((s, idx) => (
                                                    <button 
                                                        key={idx} 
                                                        onClick={() => setInputText(s)}
                                                        className="suggestion-chip px-3 py-1.5 rounded-full text-[11px] font-bold"
                                                    >
                                                        {s}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    <div className="flex gap-3 items-center bg-slate-50 p-1.5 rounded-2xl border border-slate-100">
                                        <button className="p-2.5 text-slate-400 hover:text-blue-500 hover:bg-blue-50 rounded-xl transition-all"><Icon name="add" size={22} /></button>
                                        <input 
                                            type="text" 
                                            value={inputText}
                                            onChange={(e) => setInputText(e.target.value)}
                                            placeholder="在此輸入訊息..." 
                                            className="flex-1 bg-transparent border-none px-2 py-2 text-xs focus:ring-0 outline-none font-medium"
                                            onKeyDown={(e) => e.key === 'Enter' && handleSend()}
                                        />
                                        <button 
                                            onClick={handleSend}
                                            className="bg-[#06c755] text-white p-2.5 rounded-xl hover:bg-[#05a64a] shadow-md shadow-green-100 transition-all"
                                        >
                                            <Icon name="send" size={18} />
                                        </button>
                                    </div>
                                </div>
                            </>
                        ) : (
                            <div className="flex-1 flex flex-col items-center justify-center text-slate-300 animate-in">
                                <div className="w-20 h-20 bg-white rounded-[32px] flex items-center justify-center shadow-sm mb-6">
                                    <Icon name="chat" size={40} className="text-slate-200" />
                                </div>
                                <p className="text-xs font-black uppercase tracking-[0.3em]">選擇一個 LINE OA 對話</p>
                                <p className="text-[10px] mt-2 text-slate-400 tracking-widest uppercase">Messaging API: Connection Stable</p>
                            </div>
                        )}
                    </div>
                </div>
            );

            // --- 主導航架構 ---
            return (
                <div className="min-h-screen flex antialiased">
                    <aside className="w-[280px] bg-white border-r border-slate-100 flex flex-col p-6 hidden lg:flex fixed h-full z-40 shadow-sm">
                        <div className="flex items-center gap-3 mb-10 px-2">
                            <div className="w-12 h-12 bg-gradient-to-br from-blue-600 to-blue-700 rounded-[22px] flex items-center justify-center text-white shadow-xl">
                                <Icon name="monitoring" size={24} />
                            </div>
                            <div className="leading-tight">
                                <h1 className="text-lg font-black tracking-tighter text-slate-800 uppercase">DS PRO</h1>
                                <p className="text-[9px] font-black text-slate-400 uppercase tracking-widest italic leading-none">Intelligent Matrix</p>
                            </div>
                        </div>
                        
                        <nav className="flex-1 space-y-2.5">
                            <button onClick={() => setView('overview')} className={`w-full flex items-center gap-3 px-5 py-4 rounded-[22px] transition-all duration-300 ${view === 'overview' ? 'nav-active font-black scale-105' : 'text-slate-500 hover:bg-slate-50'}`}>
                                <Icon name="dashboard" size={20} />
                                <span className="text-sm font-bold tracking-tight">營運數據看板</span>
                            </button>
                            <button onClick={() => setView('chat')} className={`w-full flex items-center gap-3 px-5 py-4 rounded-[22px] transition-all duration-300 ${view === 'chat' ? 'nav-active font-black scale-105' : 'text-slate-500 hover:bg-slate-50'}`}>
                                <Icon name="chat" size={20} />
                                <span className="text-sm font-bold tracking-tight">LINE 接管對話</span>
                            </button>
                            <button onClick={() => setView('crm')} className={`w-full flex items-center gap-3 px-5 py-4 rounded-[22px] transition-all duration-300 ${view === 'crm' ? 'nav-active font-black scale-105' : 'text-slate-500 hover:bg-slate-50'}`}>
                                <Icon name="security" size={20} />
                                <span className="text-sm font-bold tracking-tight">CRM 權限矩陣</span>
                            </button>
                            <div className="pt-8 opacity-40">
                                <p className="px-4 text-[10px] font-black uppercase tracking-[0.2em] mb-4">資料中心</p>
                                <button onClick={() => setView('cal')} className={`w-full flex items-center gap-3 px-5 py-4 rounded-[22px] transition-all duration-300 ${view === 'cal' ? 'nav-active font-black scale-105' : 'text-slate-500 hover:bg-slate-50'}`}>
                                    <Icon name="calendar_month" size={20} />
                                    <span className="text-sm font-bold tracking-tight">部門行事曆管理</span>
                                </button>
                            </div>
                        </nav>

                        <div className="mt-auto p-5 bg-slate-50 rounded-[32px] text-center border border-slate-100">
                            <div className="flex items-center justify-center gap-2 text-green-600 text-[10px] font-black uppercase mb-1">
                                <div className="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></div>
                                Worker & GAS: OK
                            </div>
                            <p className="text-[9px] text-slate-400 font-bold uppercase tracking-tighter">AI Silence Monitoring ON</p>
                        </div>
                    </aside>

                    <main className="flex-1 lg:ml-[280px] p-10 overflow-y-auto h-screen scrollbar-hide">
                        <header className="flex justify-between items-center mb-10">
                            <div className="relative w-96 group">
                                <Icon name="search" size={18} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300" />
                                <input type="text" placeholder="搜尋對話、人員、報到點..." className="w-full bg-white border border-slate-100 rounded-2xl py-3.5 pl-12 pr-4 text-xs shadow-sm focus:ring-4 focus:ring-blue-50 outline-none font-bold transition-all" />
                            </div>
                            <div className="flex items-center gap-5">
                                <div className="w-11 h-11 bg-white border border-slate-100 rounded-2xl flex items-center justify-center text-slate-400 relative cursor-pointer hover:bg-slate-50 transition-all shadow-sm">
                                    <Icon name="notifications" size={22} />
                                    <div className="absolute top-3 right-3 w-2 h-2 bg-red-500 rounded-full border-2 border-white"></div>
                                </div>
                                <div className="h-8 w-px bg-slate-200"></div>
                                <div className="flex items-center gap-4 bg-white p-2 pr-6 rounded-2xl border border-slate-100 shadow-sm cursor-pointer hover:bg-slate-50 transition-all">
                                    <div className="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center font-black text-xs uppercase">{user.name[0]}</div>
                                    <div className="text-left leading-none">
                                        <p className="text-xs font-black text-slate-800 uppercase">{user.name}</p>
                                        <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1">{user.dept}</p>
                                    </div>
                                </div>
                            </div>
                        </header>

                        {view === 'overview' && (
                            <div className="p-24 text-center bg-white rounded-[56px] border border-dashed border-slate-200 animate-in">
                                <Icon name="bar_chart" size={56} className="mx-auto text-slate-100 mb-6" />
                                <p className="text-slate-400 font-black uppercase tracking-[0.4em] text-xs">營運數據同步中</p>
                                <p className="text-slate-300 text-[10px] mt-4 font-bold uppercase tracking-widest italic">Linking to Database Persistence Layer...</p>
                            </div>
                        )}
                        {view === 'chat' && <ChatTakeover />}
                        {view === 'crm' && (
                            <div className="p-24 text-center bg-white rounded-[56px] border border-dashed border-slate-200 animate-in">
                                <Icon name="security" size={56} className="mx-auto text-slate-100 mb-6" />
                                <p className="text-slate-400 font-black uppercase tracking-[0.4em] text-xs">權限模組同步中</p>
                            </div>
                        )}
                        {view === 'cal' && (
                            <div className="p-24 text-center bg-white rounded-[56px] border border-dashed border-slate-200 animate-in">
                                <Icon name="calendar_month" size={56} className="mx-auto text-slate-100 mb-6" />
                                <p className="text-slate-400 font-black uppercase tracking-[0.4em] text-xs">跨部資料同步中</p>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
